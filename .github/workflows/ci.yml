name: CI

# Field whitelist (single source of truth — pinned by
# tests/integration/test_ci_alignment.py).
#
#   * Top-level fields:
#       name, on, concurrency, permissions, jobs
#   * Job-level fields:
#       name, runs-on, needs, if, steps, permissions, timeout-minutes,
#       concurrency, strategy, env, continue-on-error
#   * Step-level fields:
#       id, name, if, run, uses, with, working-directory,
#       continue-on-error, env, shell, timeout-minutes
#
# Adding a field here requires (a) updating the Python constants
# ALLOWED_TOP_LEVEL_FIELDS / ALLOWED_JOB_LEVEL_FIELDS /
# ALLOWED_STEP_LEVEL_FIELDS in the test file to match, and
# (b) confirming GitHub Actions accepts the new key. Removing a
# field here requires first removing it from ci.yml.
#
# Slim CI pipeline — target total runtime ≤ 15 minutes.
#   1. PR gate:       lint + unit (sharded, with coverage) + integration
#                     + e2e + keychain E2E (macOS) + time-sensitive
#                     ← all of it gates the merge, and it is the ONLY
#                     trigger that matters
#   2. Nightly:       full automated regression suite (1482 tests),
#                     not blocking the merge gate
#   3. Manual dispatch: maintainer-triggerable re-run of any layer
#
# There is no post-merge run. It was removed on 2026-10-05 — see the
# `on:` block for why it existed, and for the one repository setting the
# removal depends on.
#
# Layered jobs (test-design decision point 7): unit / integration / e2e
# / time-sensitive / nightly — each is its own job with its own marker,
# timeout, and coverage gate. Every layer except nightly gates the merge,
# so all of them run on `pull_request`; a gate that only runs after the
# merge is a report, not a gate. They were main-only until 2026-10-02 on
# the reading that e2e and the time-sensitive set belonged to the
# release — measured, e2e is 17 tests in 28 seconds and the
# time-sensitive lane is 30 in 32, so the cost was a revert instead of a
# red PR. The time-sensitive lane is chained after the unit shards
# (`needs: unit-tests`) because it is the one layer whose assertions are
# about wall-clock time and therefore only mean something on a runner
# that is not already busy.
#
# The unit lane is a MATRIX of three shards (2026-09-22). As a single
# job it ran 4916 tests and died at ~49 minutes on a GitHub runner with
# "lost communication with the server" — no log uploaded, three runs in
# a row. Shards report independently, so a slow or dying one names
# itself; each writes its own ``.coverage.<shard>`` data file and the
# ``coverage-gate`` job combines them to enforce the 80 % floor on the
# union (a per-shard percentage would be meaningless).
#
# The nightly runs in two places, split by what each can actually
# execute (2026-09-25):
#
#   * here, on the ``schedule`` trigger — the cloud-runnable set: unit +
#     integration + contract checks, minus the ``real_model`` tests
#     (they need the claude CLI and a live provider, so the ``CI=true``
#     contract in tests/conftest.py skips them);
#   * on the operator's machine, as an externally-scheduled job — ONLY the
#     ``real_model`` marker, i.e. exactly what the cloud cannot run.
#
# The two sets are disjoint; neither duplicates the other. All pytest
# invocations go through backend/.venv (CLAUDE.md: never use system
# Python to run pytest — it has stale urllib3 + missing packages).
#
# The previous pipeline ran a "Run full backend suite (regression)"
# step on every push to main that re-ran all 1482 unit + integration
# tests in addition to the E2E suite. That step was responsible for
# 45+ minute CI runs. It now lives only in the nightly regression layer,
# which runs once a day and does not block the merge gate.
#
# Boundary semantics:
#   - lint fail                          -> unit + integration skipped
#   - unit fail (any shard)              -> coverage-gate + integration skipped
#   - coverage-gate fail (<80%)          -> integration skipped
#   - integration fail                   -> PR is blocked
#   - e2e failure                        -> PR is blocked
#   - keychain E2E failure (macOS)       -> PR is blocked
#   - time-sensitive failure             -> PR is blocked
#   - nightly-regression failure         -> reports only; never blocked a merge
#   - Coverage report (unit)             -> uploaded as artifact on every PR
#   - New code line coverage             -> gate ≥ 80% (--cov-fail-under=80,
#                                           via coverage-gate on the combined
#                                           shard data)
#   - secrets/permissions                -> least-privilege defaults (contents:read)

on:
  pull_request:
    branches: [main]
  # NO `push:` trigger — and that is load-bearing, not an omission.
  #
  # This workflow ran on `push: branches: [main]` from 2026-09-22 until
  # 2026-10-05. It predates the `main: pull request required` ruleset
  # (2026-09-29), back when the repo really did merge locally and push
  # main directly; the push clause was added then because without it
  # main was never tested at all. Once the ruleset landed, every commit
  # on main arrived through a pull request, so the push run re-executed
  # a suite that had just been green on the same tree — 30 jobs,
  # ~30 runner-minutes, per merge, blocking nothing (the code is
  # already on main by then).
  #
  # What makes the PR run sufficient to test main is
  # `required_status_checks.strict = true` in main's branch protection
  # ("Require branches to be up to date before merging"): a PR cannot be
  # merged onto a base it is behind without "Update branch", which is a
  # push to the PR branch, which re-triggers this workflow against the
  # tree that will actually land. So the green that opens the merge
  # button is the green for main's next commit.
  #
  # TURNING THAT SETTING OFF invalidates the reasoning above and
  # requires putting a push trigger back. Nothing in this file detects
  # the setting changing; `strict` lives in the repository settings, not
  # in the tree, and no test here can read it.
  # Cloud nightly — the half of the nightly that CAN run on a hosted
  # runner: everything except the ``real_model`` tests (those call a real
  # model through the ``claude`` CLI and are skipped here by the
  # ``CI=true`` contract in ``backend/tests/conftest.py``).
  #
  # Division of labour with whatever local nightly an operator runs on
  # their own machine (scheduled outside this repository):
  #
  #   * cloud  → the cloud-runnable set (unit + integration + contract,
  #              minus e2e/time-sensitive/perf/real_model)
  #   * local  → ONLY the ``real_model`` marker, i.e. exactly what the
  #              cloud cannot run
  #
  # The two sets are disjoint, so neither run duplicates the other. This
  # trigger was absent between 2026-09-22 (when the local nightly moved
  # to an external scheduler) and 2026-09-25; the local job had in the
  # meantime been reduced to the model-calling tests only, which left the
  # cloud set unscheduled — hence the split above rather than a single
  # owner.
  schedule:
    # 00:00 CST — two hours before the local nightly, so a cloud failure
    # is already visible when the local run reports.
    - cron: "0 16 * * *"
  # Manual trigger — lets a maintainer force any layer when investigating
  # a flaky marker without waiting for the next push or the nightly cron.
  workflow_dispatch:
    inputs:
      layer:
        description: "Which test layer to run (unit|integration|e2e|time-sensitive|nightly)"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - time-sensitive
          - nightly
      # Bisection harness for the "a shard wedges the runner" failure
      # (2026-09-23). A JSON array of matrix entries; each one becomes a
      # `unit-staircase` job. Empty means "don't run that job at all".
      #
      # It lives on workflow_dispatch rather than on the push path for one
      # reason: the search must cost a dispatch, not a push. `unit` and
      # `root` hang such that the step and job timeouts never fire and
      # GitHub cancels at ~45 minutes with no log uploaded, so a push-based
      # search pays 45 minutes per data point. A dispatch is ~10 minutes
      # and can carry several shard sizes at once.
      #
      #   gh workflow run ci.yml -f staircase='[
      #     {"shard":"u-1","paths":"tests/unit","limit_files":1},
      #     {"shard":"u-20","paths":"tests/unit","limit_files":20}
      #   ]'
      #
      # `limit_files` is optional: run only the first N files (sorted) that
      # pytest collects for `paths` — an alphabetical prefix, so nesting
      # one staircase inside a bigger one is a true superset.
      staircase:
        description: "JSON array of {shard, paths, limit_files?} for wedge bisection (empty = off)"
        required: false
        default: ""
      # Explicit opt-in for the dangerous REAL plan migration suite.
      # The mock-plan E2E runs on every pull request (see
      # e2e-on-demand below). The real-plan migration writes to the
      # production ``plans/`` directory and MUST NEVER run on a routine
      # PR or the nightly cron; only an explicit
      # ``run_real_plan_migration == 'true'`` maintenance dispatch
      # unlocks it. The boolean default is ``false`` so a bare
      # ``Run workflow`` click cannot trigger the real-plan migration by
      # accident.
      run_real_plan_migration:
        description: "Run the REAL plan migration suite (writes to plans/) - DANGEROUS"
        required: true
        type: boolean
        default: false

# Cancel previous in-flight runs for the same PR / branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege permissions. Jobs explicitly request additional scopes
# (e.g. pull-requests: write for status comments) only when needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — LINT (PR gate)
  # Static security scan (bandit) + provider-ID scans. If this stage fails,
  # neither unit nor integration will run (needs: chain below).
  # ---------------------------------------------------------------------------

  lint:
    name: Lint (bandit static scan)
    runs-on: ubuntu-latest
    # Style gate. The bandit + provider-ID + legacy-URL-map scans are
    # static and finish in well under a minute.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # -ll = medium+ severity. JSON output feeds into the next step.
      # Non-zero exit on findings -> PR is blocked.
      #
      # Invoked through the project venv, like every pytest invocation
      # in this file. `uv sync` installs into backend/.venv, not into
      # the setup-python environment, so a bare `bandit` is no longer on
      # PATH — the same "never trust the system interpreter" rule the
      # pytest lanes follow, applied to the one tool in this job.
      - name: Run bandit scan
        working-directory: backend
        run: ./.venv/bin/bandit -r . -ll -f json -o bandit-report.json || true

      # Enforce bandit gate via grep (avoid embedding Python f-strings
      # in the YAML block scalar — they collide with YAML colon parsing
      # on some parsers). The scan step writes bandit-report.json; if
      # it contains any HIGH/MEDIUM hits we exit non-zero.
      - name: Enforce bandit gate (block PR on findings)
        working-directory: backend
        run: |
          if [ ! -f bandit-report.json ]; then
            echo "bandit-report.json not found — bandit step did not run?"
            exit 1
          fi
          # Count lines with issue_severity HIGH or MEDIUM in the
          # bandit JSON output. Each finding has its own line so a
          # simple grep -c suffices.
          high_count=$(grep -c '"issue_severity": "HIGH"' bandit-report.json || true)
          med_count=$(grep -c '"issue_severity": "MEDIUM"' bandit-report.json || true)
          echo "Bandit findings: HIGH=$high_count MEDIUM=$med_count"
          total=$(( high_count + med_count ))
          if [ "$total" -gt 0 ]; then
            echo "Bandit gate FAILED: $total medium/high issues"
            grep -E '"(test_id|issue_severity|filename|line_number|issue_text)"' bandit-report.json | head -30
            exit 1
          fi
          echo "Bandit gate passed (no medium/high issues)"

      # The provider-ID scanners are the second half of the static gate:
      # they enforce the "single source of truth" contract (no hardcoded
      # provider URLs/keys/registry dicts/legacy bare IDs, and no legacy
      # CC Switch JSON indirection references). Failures here block the PR.
      - name: Run hardcoded provider ID scan
        run: python scripts/scanners/scan_hardcoded_provider_ids.py

      - name: Run legacy provider URL map reference scan
        run: python scripts/scanners/scan_provider_url_map_refs.py

  # ---------------------------------------------------------------------------
  # STAGE 1b — GREP GUARD (fast static gate)
  # Runs the project's regex-sweep scanner over the production
  # tree (server.py + verification_executor.py + state_machine/) for
  # the five forbidden JSON state-file construction patterns pinned
  # by backend/tests/grep_guard.py. Because this gate is purely a
  # regex sweep it finishes in seconds, so we run it BEFORE unit to
  # fail fast on known bug shapes without wasting CI minutes on
  # pytest collection.
  # ---------------------------------------------------------------------------

  grep-guard:
    name: Grep guard (forbidden filename regex sweep)
    runs-on: ubuntu-latest
    # Static sweep. Cheap enough to always run, and gating on PR means
    # a developer never has to wait for the unit gate to discover that
    # they reintroduced a forbidden filename pattern.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # Run the scanner via the shared ``scripts/grep_guard.sh`` wrapper.
      # The wrapper owns:
      #   * venv-python resolution (CLAUDE.md: never use system Python
      #     for pytest-family commands — system Python has stale
      #     urllib3 + missing packages);
      #   * ``sys.path`` insertion for the standalone ``grep_guard``
      #     module (which lives outside any package);
      #   * the exit-code contract (0 = clean, 1 = violations, 2 =
      #     setup error) consumed by ``bash`` below.
      # The wrapper is the SAME entry point developers invoke locally
      # and that ``.pre-commit-config.yaml`` hooks call, so CI never
      # diverges from local enforcement.
      - name: Run grep-guard scan
        working-directory: backend
        run: bash ../scripts/grep_guard.sh

  # ---------------------------------------------------------------------------
  # STAGE 1 — STATIC GATES
  #
  # The 200-odd contracts in ``backend/tests/static_gates/`` are pytest
  # files, so before this job they ran inside the ``root`` lane — sharded
  # across ``root-0..root-6``, in parallel with the other nineteen. That
  # made them a gate in name only: a static failure arrived at the same
  # moment twenty runners were already committed to finishing, and the
  # operator paid for all of them to learn something a 15-second job
  # could have said first.
  #
  # Here they are their own job, and every test lane depends on it. One
  # runner, no shard matrix, no coverage instrumentation (``.coveragerc``
  # omits ``tests/*``, so moving them out of the sharded lanes does not
  # change the 80% aggregate at all).
  #
  # What it costs: the lanes start ~40s later, once the slowest
  # prerequisite reports. What it buys: a red gate costs one VM instead
  # of twenty, and says so in about a minute instead of after the whole
  # matrix. On a repository whose failures are mostly "someone changed
  # one thing and it broke a contract", that is the right side of the
  # trade.
  # ---------------------------------------------------------------------------

  static-gates:
    name: Static gates (contracts)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # No ``--cov``: these tests measure source shape, not behaviour,
      # and their own lines are excluded from the coverage aggregate by
      # ``.coveragerc`` anyway.
      - name: Run the static gates
        working-directory: backend
        run: |
          .venv/bin/python3 -m pytest tests/static_gates/ \
            -p no:cacheprovider -q --timeout=300

  # ---------------------------------------------------------------------------
  # Commit-message hygiene
  # ---------------------------------------------------------------------------
  # Rejects the two shapes that make an authorship claim about an AI system:
  # a ``Co-Authored-By:`` trailer naming one, or a "Generated with <tool>"
  # line. The rule and its rationale live in scripts/check_commit_msg.py —
  # this job exists so that ``git commit --no-verify``, or a clone with no
  # hooks installed, still cannot land such a trailer on main.
  #
  # No venv and no dependency install: the checker is stdlib-only, so the
  # job costs a deep checkout and a few milliseconds.
  # ---------------------------------------------------------------------------
  commit-hygiene:
    name: Commit messages carry no AI attribution trailer
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The range below walks history, so a shallow clone would not
          # contain the commits being checked.
          fetch-depth: 0

      - name: Check every commit in the range
        run: |
          set -euo pipefail

          # Empty on a manual dispatch, which the resolution below turns
          # into HEAD~1..HEAD (and says so). There is no push trigger, so
          # `github.event.before` is gone.
          BASE="${{ github.event.pull_request.base.sha }}"

          # Resolve the range, and say so loudly when we cannot. A range
          # git refuses to parse lists no commits at all, which would make
          # this job green while checking nothing — the failure mode that
          # matters more than a missed commit.
          if git rev-parse --quiet --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            RANGE="${BASE}..HEAD"
          elif git rev-parse --quiet --verify "HEAD~1" >/dev/null 2>&1; then
            echo "::warning::base ${BASE} is not resolvable; checking HEAD~1..HEAD only"
            RANGE="HEAD~1..HEAD"
          else
            echo "::warning::no base and no parent commit; checking the tip only"
            RANGE="HEAD"
          fi

          echo "checking commits in ${RANGE}"
          # ``rc`` rather than ``status``: the latter is a read-only
          # special variable in zsh, so a local reproduction of this
          # block under zsh dies on the assignment instead of checking
          # anything. CI runs bash, but the block should survive being
          # pasted into either shell.
          rc=0
          while read -r sha; do
            [[ -z "$sha" ]] && continue
            if ! git log -1 --format=%B "$sha" | python3 scripts/check_commit_msg.py --stdin; then
              echo "  ^ commit ${sha}" >&2
              rc=1
            fi
          done < <(git log --format=%H "${RANGE}")

          exit "${rc}"

  # ---------------------------------------------------------------------------
  # STAGE 1c — COMMIT RANGE (the history gate)
  #
  # The privacy gates in ``backend/tests/static_gates/`` read the current
  # tree. That answers "is the repository clean now", not "did we publish
  # something we should not have". A commit that adds an operator's private
  # project name and a later commit that removes it leaves a *clean tree*
  # and a dirty history — every tree gate passes — while the dirty commit
  # stays fetchable by its SHA, and through ``refs/pull/<N>/head`` even
  # after a squash merge.
  #
  # So this job scans every commit in the pushed range: not the diff, not
  # the tree. The rules are the *same pure functions* the tree gates use
  # (imported by ``commit_range_scan.py``, never restated), so the two
  # scans cannot disagree about what a violation is.
  #
  # ``--max-commits 5`` is a scan budget as much as a hygiene rule: this
  # job's cost is linear in the number of commits, and a pull request with
  # sixty commits wants squashing before review regardless.
  #
  # This job runs on the pull request, so it is now *preventive* rather
  # than detective: a violation here closes the merge gate and nothing
  # is published. While it also ran on push to main it was strictly
  # detective — by then the commit was already public and force-push
  # could not undo it. That run was removed 2026-10-05; the
  # ``pre-push`` hook (scripts/install_git_hooks.sh) is still the
  # cheapest half, because rewriting an unmerged commit costs nothing.
  # ---------------------------------------------------------------------------
  commit-range-privacy:
    name: Commits carry no private info (every commit in the range)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The scan walks history, so a shallow clone would not contain
          # the commits being checked — and an empty walk must not be
          # allowed to read as a clean one.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # This job needs no project dependencies of its own: the scanner
      # imports the gate *modules*, those import pytest for their own
      # test functions, and the rules the scanner calls (find_home_paths
      # / find_attribution / find_local_measurements) are pure. It used
      # to install pytest alone. It now takes the same locked sync as
      # every other lane, because "install one package by hand" was the
      # shape that put unpinned pytest into venvs in the first place —
      # and the extra packages cost this job nothing.
      # Same reason as the install steps above: uv's cache directory is not
      # the one setup-python restores, so without this the scanner's sync
      # re-downloads on every run.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create the venv the scanner resolves
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      - name: Install gitleaks (pinned by version and checksum)
        env:
          GITLEAKS_VERSION: "8.30.1"
          # Published digest for gitleaks_8.30.1_linux_x64.tar.gz. Pinning
          # the digest as well as the version keeps the scanner from
          # changing under us — a gate whose detector updates itself is a
          # coin flip. Extracted into /tmp and put on PATH via
          # $GITHUB_PATH rather than installed into /usr/local/bin, so the
          # step needs no sudo.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Scan every commit in the range
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # The workflow computes the base; the script owns the resolution
          # (including the loud fallback when the base does not resolve),
          # so the same code path runs here and in the pre-push hook.
          # There is no push trigger, so a manual dispatch leaves this
          # empty and the script checks ``HEAD~1..HEAD`` and says so.
          PDT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gitleaks version
          bash scripts/scan_commit_range.sh --ci --max-commits 5

  # ---------------------------------------------------------------------------
  # STAGE 1d — PR METADATA (the fourth surface)
  #
  # The tree gates read the tree. The range gate above reads the commits.
  # Neither reads the branch name or the pull request title — and GitHub
  # composes both into the merge commit message:
  #
  #     Merge pull request #27 from <owner>/<branch>
  #
  #     <title>
  #
  #     <body>
  #
  # So those words land on ``main`` permanently and publicly, having passed
  # every other gate in this file. This job closes that surface using the
  # same pure functions (``find_home_paths`` / ``find_attribution`` /
  # ``find_local_measurements``) — four surfaces, one definition of a
  # violation, no second copy of a rule to drift.
  #
  # It is cheap (no test run, no checkout of the base) so it sits upstream
  # of the matrix rather than beside it.
  #
  # What it cannot do: decide that a branch name refers to an unrelated
  # project. The identifiers that would decide that are themselves the
  # leak — writing one into this repository to blacklist it publishes the
  # private name inside the blacklist. That case is a human reading the
  # pull request, which is the whole argument for checking here instead of
  # after the merge.
  # ---------------------------------------------------------------------------

  pr-metadata-privacy:
    name: PR title and branch carry no private info
    runs-on: ubuntu-latest
    # Pull request only. On a manual dispatch there is no pull request,
    # so there is nothing to scan — and the scanner would (correctly)
    # exit 2 rather than report a vacuous pass.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # This job needs no project dependencies of its own: the scanner
      # imports the gate *modules*, those import pytest for their own
      # test functions, and the rules the scanner calls (find_home_paths
      # / find_attribution / find_local_measurements) are pure. It used
      # to install pytest alone. It now takes the same locked sync as
      # every other lane, because "install one package by hand" was the
      # shape that put unpinned pytest into venvs in the first place —
      # and the extra packages cost this job nothing.
      # Same reason as the install steps above: uv's cache directory is not
      # the one setup-python restores, so without this the scanner's sync
      # re-downloads on every run.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Create the venv the scanner resolves
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      - name: Scan the branch name, title and body
        env:
          # These three compose the merge commit message. An unset one
          # makes the scanner exit 2, so a dropped `env:` block fails
          # loudly instead of scanning nothing and reporting success.
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          backend/.venv/bin/python3 \
            backend/tests/static_gates/pr_metadata_scan.py

  # ---------------------------------------------------------------------------
  # STAGE 2 — UNIT (PR gate)
  # Depends on lint AND grep-guard: if either upstream gate fails,
  # unit is skipped (the ``needs:`` chain enforces this). Runs
  # pytest under the project's venv (backend/.venv/bin/python3) per
  # CLAUDE.md — never the system Python (the old Xcode 3.9 base had
  # dependency skew that breaks pytest; the venv was rebuilt on
  # Homebrew 3.11 on 2026-08-28, and CI pins 3.11 to match it).
  # ---------------------------------------------------------------------------

  unit-tests:
    name: Unit tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 2026-09-22 — sharded. Before this the lane was ONE job running
    # `pytest tests/ -m "not e2e and not integration"` — 4916 tests, and
    # on a GitHub runner that job died at ~49 minutes with "The hosted
    # runner lost communication with the server", which uploads no log
    # at all (runs 35725371222, 35739754628, 35743882365 — and the same
    # 49-minute signature on the 2026-09-16 PR run 35077046987).
    #
    # The same suite is 7m18s locally and 8m29s in a 4-CPU Linux
    # container, so the wall clock on CI is ~6x the container's and the
    # cause is still unidentified. Splitting the lane is both the fix
    # (a fraction of the work per job, so each one is comfortably inside
    # any per-job ceiling) and the diagnostic (each shard reports
    # independently, so a slow or dying shard names itself instead of
    # taking the whole lane's evidence down with it).
    #
    # Sizes measured with `--collect-only`: tests/unit 3254,
    # root-level tests/*.py 1468, the rest 194.
    timeout-minutes: 40
    # 2026-09-22 — this lane was widened to a push-to-main predicate,
    # and it was CORRECT then: the repo merged locally and pushed main
    # directly, with no pull request, so a PR-only ``if:`` left main
    # never unit-tested. Run 35725018566 is the evidence —
    # ``conclusion: success`` with unit, integration and e2e all
    # ``skipped``; the only real checks were lint + grep-guard + slow.
    # A second, subtler version of the same bug rode along: e2e carries
    # ``needs: integration-tests``, so a PR-only condition on this job
    # skipped the chain and GitHub reported green.
    #
    # 2026-10-05 — narrowed back to pull_request only. The
    # ``main: pull request required`` ruleset landed 2026-09-29, so every
    # commit on main now arrives through a PR, and the push run was a
    # second full pass over a tree that had just been green. See the
    # ``on:`` block for the dependency this rests on.
    if: github.event_name == 'pull_request'
    # Chain the layered gates: lint (style) + grep-guard (fast
    # static scan) BOTH must pass before unit runs. A grep-guard
    # failure on a forbidden filename pattern fails fast (seconds)
    # and blocks the slower unit + integration layers from wasting
    # CI minutes on a known-bad tree.
    # Every cheap gate is a prerequisite, not just grep-guard. A shard is
    # a whole runner VM: starting twenty of them and then discovering
    # that bandit failed wastes the entire matrix. The gates run in
    # parallel and the slowest is ~45s, so the serial cost on a green
    # pull request is a few seconds — cheap against twenty VMs burned
    # on a red one.
    needs: [lint, grep-guard, commit-hygiene, commit-range-privacy, pr-metadata-privacy, static-gates]
    # ``fail-fast: false`` is deliberate: one shard dying must not
    # cancel the others, because the surviving shards are exactly the
    # evidence needed to locate the problem.
    strategy:
      fail-fast: false
      matrix:
        include:
          # ----------------------------------------------------------------
          # Sizing rule (2026-09-29). A shard only finishes if it is small
          # enough; that is now measured, not guessed. Every shard that has
          # ever completed on the runner ran ~25 test files / ~200 tests /
          # under 2.5 minutes, and every one that was reaped at 45m00s ran
          # 766 tests or more:
          #
          #   ctrl-1-25   25 files   40s      success
          #   alt-26-50   25 files   2m22s    completed (real test errors)
          #   misc        194 tests  1m40s    success
          #   u-75        766 tests            reaped at 45m00s
          #   root        1622 tests           reaped at 45m00s
          #   unit        3482 tests           reaped at 45m00s
          #
          # So `unit` (283 files) is cut into 12 and `root` (175 files)
          # into 7, both landing at ~24 files per shard — inside the band
          # that finishes, with headroom. Round-robin over the collected
          # file list (``NR % n == index``) keeps every file in exactly one
          # shard, so the union of the shards is the union the single job
          # used to run and the combined coverage is unchanged.
          #
          # `lane` (not `paths`) is the matrix key so each of the 20
          # entries stays one line; the step maps lane to its path set and
          # then slices it. The `root` path set keeps its original
          # reasoning: ``tests/integration`` and ``tests/e2e`` are
          # deliberately NOT ignored — the ``-m`` filter already drops the
          # marked tests inside them, and ignoring the directories
          # silently dropped 209 tests.
          - { lane: unit, shard: unit-00, index: "0",  count: "12" }
          - { lane: unit, shard: unit-01, index: "1",  count: "12" }
          - { lane: unit, shard: unit-02, index: "2",  count: "12" }
          - { lane: unit, shard: unit-03, index: "3",  count: "12" }
          - { lane: unit, shard: unit-04, index: "4",  count: "12" }
          - { lane: unit, shard: unit-05, index: "5",  count: "12" }
          - { lane: unit, shard: unit-06, index: "6",  count: "12" }
          - { lane: unit, shard: unit-07, index: "7",  count: "12" }
          - { lane: unit, shard: unit-08, index: "8",  count: "12" }
          - { lane: unit, shard: unit-09, index: "9",  count: "12" }
          - { lane: unit, shard: unit-10, index: "10", count: "12" }
          - { lane: unit, shard: unit-11, index: "11", count: "12" }
          - { lane: root, shard: root-0, index: "0", count: "7" }
          - { lane: root, shard: root-1, index: "1", count: "7" }
          - { lane: root, shard: root-2, index: "2", count: "7" }
          - { lane: root, shard: root-3, index: "3", count: "7" }
          - { lane: root, shard: root-4, index: "4", count: "7" }
          - { lane: root, shard: root-5, index: "5", count: "7" }
          - { lane: root, shard: root-6, index: "6", count: "7" }
          - lane: misc
            shard: misc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # --- Mitigate actions/runner-images#13770 (2026-09-29) ---------------
      #
      # The Ubuntu 24.04 runner image ships a ``read_ahead_kb`` high enough
      # to thrash the page cache on I/O-heavy jobs. Collection imports every
      # test module and ``--cov=.`` instruments all of them, so this shard is
      # about as I/O-heavy as a job gets.
      #
      # The symptom is NOT "the tests are slow", it is "the runner stops
      # reporting". On run 36549676307 this shard's pytest step sat
      # ``in_progress`` past BOTH its own ``timeout-minutes: 20`` (due
      # 11:49:27) and the watchdog's 15-minute budget (due 11:44:27), while
      # ``misc`` — a different, smaller VM on the same run — passed in 99s;
      # GitHub then reaped the job at exactly 45m00s having uploaded nothing.
      #
      # That is why no in-workflow budget can be the fix: every ceiling in
      # this file is enforced by a process *on the runner*, so a runner that
      # has stopped reporting can neither enforce one nor upload a log. The
      # only defence is not to trigger the bug, which is what this step is.
      # The nightly job has carried this mitigation since the runner bug was
      # first seen; the shards that actually die did not.
      #
      # Unlike the nightly's copy, this one reports what it touched and warns
      # when the globs match nothing. A mitigation that silently no-ops is
      # indistinguishable from one that was deleted, and the device names on
      # the runner image have changed before.
      - name: Mitigate runner-images#13770 (read_ahead_kb)
        run: |
          sudo bash -c '
            shopt -s nullglob
            touched=0
            for dev in /sys/block/sd* /sys/block/nvme*n*; do
              if [ -e "$dev/queue/read_ahead_kb" ]; then
                echo "  $(basename $dev): $(cat $dev/queue/read_ahead_kb) -> 128"
                echo 128 > "$dev/queue/read_ahead_kb"
                touched=$((touched + 1))
              fi
            done
            if [ "$touched" -eq 0 ]; then
              echo "::warning::read_ahead_kb matched no block device — the globs are stale for this runner image, so runner-images#13770 is NOT mitigated and the shard may stop reporting"
            else
              echo "read_ahead_kb lowered on $touched block device(s)"
            fi
            exit 0
          '

      # Run this shard via the venv Python.
      # This pins the CLAUDE.md rule: never use system Python to run pytest.
      #
      # Coverage: each shard writes its OWN ``.coverage.<shard>`` data file
      # (via COVERAGE_FILE) instead of judging a percentage on its own —
      # a shard that runs a third of the suite would report a third of the
      # coverage. ``coverage-gate`` below downloads all three, combines
      # them, and enforces --cov-fail-under=80 on the union.
      #
      # STEP-level timeout, not just the job-level one (2026-09-23).
      # A job that is CANCELLED — by the job timeout, or by whatever
      # killed the runner at ~49 minutes — uploads NO log at all
      # (``actions/jobs/<id>/logs`` returns BlobNotFound), which is why
      # the 45-minute unit runs produced no evidence three times running.
      # A STEP that times out fails the step normally and the job then
      # continues into the ``if: always()`` upload below, so the pytest
      # output survives. That upload IS the diagnostic: its tail names
      # the last test that started.
      - name: Run unit tests — ${{ matrix.shard }} shard
        timeout-minutes: 20
        working-directory: backend
        # Unbuffered stdout so the last progress line survives even if the
        # step is killed: pytest writes to a pipe here (GitHub captures
        # it), and a block-buffered stream would lose the tail exactly
        # when it matters most — the test that stalled.
        env:
          PYTHONUNBUFFERED: "1"
          # Where ci_process_guard writes the SIGUSR1 stack dump. Handled by
          # pytest itself, in the workspace, because a dump sent to stderr is
          # swallowed by pytest's per-test fd capture and lost when the shard
          # is killed — see _arm_stack_dump's docstring.
          CI_STACK_DUMP_PATH: pytest-stack-dump-${{ matrix.shard }}.txt
        run: |
          set -o pipefail
          # --- which files this shard owns ---------------------------------
          # The matrix carries a lane plus a (index, count) pair rather
          # than a path list, so a shard is defined by a slice of the
          # collected file set rather than by a directory. Directories do
          # not split usefully here: 249 of the 283 files under
          # tests/unit sit at its top level.
          case "${{ matrix.lane }}" in
            unit) LANE_PATHS="tests/unit" ;;
            # ``--ignore=tests/static_gates`` because those are a gate,
            # not a lane: they run in the single `static-gates` job that
            # every test lane depends on. Leaving them in here meant a
            # static-gate failure arrived at the same moment 19 shards
            # were already in flight — the cost this job exists to remove.
            root) LANE_PATHS="tests/ --ignore=tests/unit --ignore=tests/static_gates --ignore=tests/contract --ignore=tests/concurrency --ignore=tests/performance --ignore=tests/security --ignore=tests/meta_tests" ;;
            misc) LANE_PATHS="tests/contract tests/security tests/meta_tests tests/concurrency tests/performance" ;;
            *) echo "::error::unknown lane '${{ matrix.lane }}'"; exit 2 ;;
          esac
          if [ -n "${{ matrix.index }}" ]; then
            # Round-robin over the collected files. Every file lands in
            # exactly one shard (``NR % count == index`` partitions the
            # list), so the shards' union is the lane's whole file set and
            # the combined coverage is what the single job produced.
            #
            # ``-o addopts=`` because pytest.ini sets ``-v``, which turns
            # ``--collect-only`` into a tree with no ``path::name`` lines
            # to slice. The file is taken by STRIPPING from ``::`` and the
            # line must actually BE a node id (``\.py::``): pytest's
            # warnings summary also emits ``tests/...`` lines, and without
            # the ``::`` they pass through as targets and pytest answers
            # "file or directory not found". Both of those bit this repo
            # on the staircase lane (runs 35851035325 and 35851915784).
            #
            # No ``-m`` here, deliberately. The marker belongs to the
            # pytest invocation below, and it is the ONLY place it is
            # written: ``test_default_lane_excludes_the_marker`` reads the
            # one authoritative expression per lane, and a second literal
            # copy would make that gate ambiguous about which one governs.
            # Omitting it costs nothing — the file set collected here is a
            # superset (a file whose tests are all marked e2e still lists),
            # and the marker on the real invocation drops exactly those
            # tests, so the set of tests actually executed is unchanged.
            echo "shard ${{ matrix.shard }}: resolving file $(( ${{ matrix.index }} + 1 )) of ${{ matrix.count }} from ${LANE_PATHS}"
            TARGETS=$(./.venv/bin/python3 -m pytest ${LANE_PATHS} \
                        --collect-only -q -o addopts= -p no:cacheprovider -p no:warnings 2>/dev/null \
                      | grep -E '^tests/[^:]*\.py::' | sed 's/::.*//' | sort -u \
                      | awk -v i="${{ matrix.index }}" -v n="${{ matrix.count }}" 'NR % n == i' \
                      | tr '\n' ' ')
            FILE_COUNT=$(echo "$TARGETS" | wc -w | tr -d ' ')
            echo "shard ${{ matrix.shard }}: ${FILE_COUNT} file(s)"
            # A shard with no files is not a shard — it is a silent hole in
            # the suite, and it would report success. Say so loudly.
            if [ "$FILE_COUNT" -eq 0 ]; then
              echo "::error::shard ${{ matrix.shard }} resolved to zero files; the slice or the lane's path set is wrong"
              exit 2
            fi
          else
            TARGETS="$LANE_PATHS"
          fi
          # NO ``ulimit`` guardrails here (2026-09-23, reverted).
          # --- one foreground `timeout`, no hand-rolled process plumbing --
          #
          # This used to be `setsid pytest &` + `tail -f --pid` + a
          # background watchdog + `wait`, and every one of those four
          # pieces is a way for the STEP to fail to end. It did: the
          # shard sat `in_progress` until the job-level 40-minute ceiling
          # cancelled it, and a cancelled job uploads nothing — the log,
          # the stack dump, the coverage data, all gone. Nine runs of
          # `unit-00` and `root-4` ended that way, which is why the wedge
          # took ten hours to locate: the failure destroyed the only
          # evidence that could have named it.
          #
          # The shape does not matter — the payload did. The shard that
          # wedged was `tests/unit/test_coding_tool.py`, whose provider-
          # fallback tests reach `kill_process_group` with a mocked
          # process. See `backend/utils/process.py` for the full account;
          # the one-line version is that a `MagicMock` resolved to a
          # process group of 1, and `os.killpg(1, SIGKILL)` is
          # `kill(-1, SIGKILL)` — a broadcast that took the runner's
          # worker down with it.
          #
          # What the foreground `timeout` buys is not a diagnosis but a
          # floor: whatever the step does, the step ends, so the
          # `if: always()` upload always runs and the next failure has
          # evidence instead of a hole.
          #
          # `timeout` is an ordinary foreground child of this shell, so
          # the shell always returns and the step always ends. Three
          # properties follow, and they are the whole fix:
          #
          #   * nothing downstream can block — there is no `wait`, no
          #     `tail`, and no background subshell holding the step's
          #     output pipe. pytest's stdout goes to a FILE, which
          #     descendants inherit as a file, so a leaked child has
          #     nothing to hold open.
          #   * the step's own `timeout-minutes: 20` works again, because
          #     the runner's process tree is once more the one it knows
          #     how to time out. Our 900s budget fires well before it, so
          #     it stays a backstop rather than the primary.
          #   * the budget still produces a diagnosis. `--signal=USR1`
          #     makes `timeout` signal pytest when the budget fires;
          #     `ci_process_guard` has `faulthandler` registered on
          #     SIGUSR1, so pytest walks every thread's C stack into
          #     `$CI_STACK_DUMP_PATH` and survives to be killed 30s later
          #     by `--kill-after`. `--foreground` is what makes the
          #     signal reach pytest ALONE: without it `timeout` signals
          #     the whole group, and a leaked descendant has no SIGUSR1
          #     handler, so it dies on the spot — taking the EOF pytest
          #     is blocked on with it, and the shard can finish before
          #     the dump is written. The thing being photographed must
          #     outlive the photograph.
          #
          # The budget is below the step's `timeout-minutes` so ours wins,
          # and below the job ceiling so the `if: always()` upload below
          # still has room to run.
          WATCHDOG_SECONDS=900

          # --- order independence ------------------------------------------
          # Shuffle the order this shard *executes* its files in, seeded
          # from the run so it differs every time but is reproducible from
          # the log. The partition above stays deterministic: the point is
          # not to move files between shards (they run on separate runners
          # and cannot interfere), it is to vary what runs before what
          # *inside* one process, because that is where order dependence
          # actually lives.
          #
          # The reason to want it: every one of these contracts passes
          # whatever order it runs in, so a passing suite has never been
          # evidence of order independence. A real example — fifteen test
          # files write ``server._verification_state`` as a bare
          # ``dict[key] = ...``, and
          # ``test_round_start_liveness_state`` asserts a count taken
          # across that whole dictionary. It passed in its natural
          # position for as long as the suite had been run, and failed on
          # the first shuffled order tried.
          # ``isolated_runtime_plan_state`` in ``tests/conftest.py`` is the
          # fix for that one; this is what keeps finding the next one.
          #
          # ``random.Random(seed).shuffle`` rather than
          # ``shuf --random-source``: the runner's ``shuf`` wants a byte
          # stream and this seed is a short string, and a stream that runs
          # dry is a second, quieter way for the order to stop varying.
          ORDER_SEED="${{ github.run_id }}.${{ github.run_attempt }}.${{ matrix.shard }}"
          # ``"$TARGETS"`` is QUOTED, and that is load-bearing. Unquoted,
          # it word-splits into one argv entry per file, so
          # ``sys.argv[1]`` is the *first file* rather than the list and
          # ``sys.argv[2]`` is the second file rather than the seed. The
          # result was a shuffle of one file: every shard ran 1 of its
          # ~23, the combined coverage fell from 80% to 11%, and **every
          # shard still reported success** — a green check standing for
          # four percent of the work. The coverage gate is what caught
          # it, and only because it measures the work rather than
          # reporting on it.
          #
          # It is also invisible on a developer machine: zsh does not
          # word-split unquoted parameter expansions, so the same snippet
          # run locally permutes the whole list. The bug lived in the gap
          # between the shell a developer types in and the bash a runner
          # executes.
          EXEC_ORDER=$(./.venv/bin/python3 -c '
          import random, sys
          files = sys.argv[1].split()
          random.Random(sys.argv[2]).shuffle(files)
          print(" ".join(files))
          ' "$TARGETS" "$ORDER_SEED")

          # And the counts are reconciled, here, against the count this
          # shard resolved. The existing empty-shard guard reads
          # ``FILE_COUNT`` — what was *resolved*, not what will be
          # *executed* — so a shuffle that quietly drops files walks
          # straight past it. That is precisely the shape of the failure
          # above: a guard that was looking at the right number and the
          # wrong moment.
          EXEC_COUNT=$(printf '%s\n' "$EXEC_ORDER" | wc -w | tr -d ' ')
          echo "execution order seed: ${ORDER_SEED}"
          echo "execution order: ${EXEC_ORDER}"
          echo "shard ${{ matrix.shard }}: ${EXEC_COUNT} file(s) to execute (of ${FILE_COUNT} resolved)"
          if [ "$EXEC_COUNT" -ne "$FILE_COUNT" ]; then
            echo "::error::shard ${{ matrix.shard }} resolved ${FILE_COUNT} file(s) but will execute ${EXEC_COUNT}; the shuffle dropped or duplicated files"
            exit 2
          fi

          set +e
          COVERAGE_FILE=.coverage.${{ matrix.shard }} \
          timeout --foreground --signal=USR1 --kill-after=30s "$WATCHDOG_SECONDS" \
            ./.venv/bin/python3 -m pytest $EXEC_ORDER \
              -m "not e2e and not integration and not time_sensitive and not perf" \
              --cov=. \
              --cov-report= \
              --tb=short \
              -p ci_process_guard \
              -p faulthandler \
              -o faulthandler_timeout=60 \
              --durations=25 \
              --timeout=60 > pytest-${{ matrix.shard }}.log 2>&1 < /dev/null
          RC=$?

          # 124 is `timeout`'s "the budget fired" code. Say so plainly
          # rather than letting a bare number be read as a crash: an OOM
          # kill is 137 and a test failure is 1, so the three are
          # distinguishable and the log should not leave it to guesswork.
          if [ "$RC" -eq 124 ]; then
            {
              echo
              echo "===== shard budget of ${WATCHDOG_SECONDS}s reached; killed ====="
              echo "The output above ends at the last test that STARTED."
              echo "The stack dump (if any) names the frame it was stuck in."
            } >> pytest-${{ matrix.shard }}.log
            echo "::error::the ${{ matrix.shard }} shard was killed at its ${WATCHDOG_SECONDS}s budget. pytest-${{ matrix.shard }}.log ends at the last test that started; the stack dump names the frame."
          fi

          # What did this shard actually leave on disk? The coverage data
          # is the input to the `coverage-gate` job, and when a shard
          # produces none that job can only say "No data to combine" twenty
          # seconds later, naming no shard. Saying it here names the shard.
          # (`ls`, not a glob: a glob that matches nothing prints its own
          # pattern and reads like a successful listing.)
          echo "----- coverage data on disk after the run -----"
          ls -la .coverage* 2>&1 || echo "(no .coverage* in $(pwd))"

          # Put the tail in the step log as well as the artifact. On a
          # green run the artifact is never opened; on a red one, the last
          # 40 lines are usually the whole answer and they should not
          # require a download to see.
          echo "----- tail of pytest-${{ matrix.shard }}.log -----"
          tail -n 40 pytest-${{ matrix.shard }}.log
          echo "----- end -----"
          exit $RC

      # The diagnostic half of the step timeout above: this runs even when
      # the test step timed out, and it is the ONLY way to see where a
      # shard got stuck (job-level cancellation uploads nothing at all).
      - name: Upload pytest output — ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.shard }}
          # The stack dump goes out with the log: when the watchdog fires,
          # the log can only say which test STARTED, and the dump is what
          # says where it was stuck. A separate artifact rather than an
          # append, so a missing dump cannot truncate the log that did
          # arrive. `if-no-files-found: warn` keeps the ordinary green run
          # (no deadline, no dump) from reporting a missing-file problem.
          path: |
            backend/pytest-${{ matrix.shard }}.log
            backend/pytest-stack-dump-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage data — ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.shard }}
          path: backend/.coverage.${{ matrix.shard }}
          # `COVERAGE_FILE` is conventionally dot-prefixed, and
          # upload-artifact v4.4+ skips hidden files unless told otherwise.
          # The file is on disk and 237 KB; the glob simply never matched
          # it, so every shard logged "No files were found" and the
          # coverage gate — which had never once run to completion, because
          # two shards always wedged first — reported "No data to combine"
          # with nothing pointing at a cause. The sibling `pytest-*.log`
          # upload in the step above is not hidden, which is exactly why
          # that one always worked and made this look like coverage
          # itself was broken.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # STAGE 1b — STAIRCASE (workflow_dispatch only): locate the CI wedge
  # ---------------------------------------------------------------------------
  #
  # `unit` and `root` used to wedge the runner, and this job is what
  # found out why — so the write-up matters more than the mechanism.
  # Short version: the step timeout never fired because the process that
  # owns that timer was dead. The shard's payload reached
  # `os.killpg(1, SIGKILL)`; on glibc that is `kill(-1, SIGKILL)`, a
  # broadcast, and it took `Runner.Worker` with it. The step could not
  # conclude, the job uploaded nothing, and GitHub's server-side timeout
  # reaped it five minutes later. Darwin rejects that same call with
  # `EPERM`, which is why the suite always passed locally and the bug
  # survived until a CI runner died. Full account in
  # `backend/utils/process.py`.
  #
  # The ladder below stays because a 95-second local pass is not proof
  # that a shard is harmless; it only proved that *this* platform does
  # not execute the call. Four runs shared the signature
  # (35725371222, 35804605555, 35813699508, 35815833805, 35845978402).
  # Locally the same selection finishes in 95s (`unit`) and 310s
  # (`root`) with the same flags, the same `--cov`, the same
  # environment and a 1.2 GB peak; a 2-CPU Linux container reproduces
  # that.
  #
  # A push-based bisection costs ~45 minutes per data point, a dispatch
  # is ~10 minutes and carries several shard sizes at once
  # (`fail-fast: false`). Putting a small shard and a large one in the
  # same dispatch separates "it accumulates with volume" from "it is
  # that shard's content" in one run.
  #
  # Not on the push path at all, and coverage-gate does not run on
  # workflow_dispatch, so nothing here can affect the merge gate.
  unit-staircase:
    name: Staircase (${{ matrix.shard }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.staircase != ''
    timeout-minutes: 40
    strategy:
      # The whole point is to see which shard dies without losing the
      # others' verdicts.
      fail-fast: false
      matrix:
        # `|| '[]'` guards the push/PR path: there `inputs.staircase` is
        # null, and `fromJSON('')` would fail the run rather than yield an
        # empty matrix.
        include: ${{ fromJSON(inputs.staircase || '[]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # Same mitigation as the unit shards, for the same reason — this lane
      # bisects the wedge, so it must not be able to hit it. See the long
      # explanation above the unit shards' copy.
      - name: Mitigate runner-images#13770 (read_ahead_kb)
        run: |
          sudo bash -c '
            shopt -s nullglob
            touched=0
            for dev in /sys/block/sd* /sys/block/nvme*n*; do
              if [ -e "$dev/queue/read_ahead_kb" ]; then
                echo "  $(basename $dev): $(cat $dev/queue/read_ahead_kb) -> 128"
                echo 128 > "$dev/queue/read_ahead_kb"
                touched=$((touched + 1))
              fi
            done
            if [ "$touched" -eq 0 ]; then
              echo "::warning::read_ahead_kb matched no block device — the globs are stale for this runner image, so runner-images#13770 is NOT mitigated"
            else
              echo "read_ahead_kb lowered on $touched block device(s)"
            fi
            exit 0
          '

      # `--cov=.` here is NOT about the coverage gate — coverage-gate does
      # not run on a dispatch and never will. It is here because a bisect
      # harness that runs a lighter shape than the shard it bisects cannot
      # find a bug that only the heavier shape has.
      #
      # This flag is **not** the explanation for the wedge, and the comment
      # used to claim it was. Measured on the shard that wedges, `--cov=.`
      # costs 0.1s (18.53s -> 18.64s locally): coverage's overhead tracks
      # the lines actually executed, and one shard touches a small slice of
      # ``backend/``. With the flag added, this lane ran the wedge's own 24
      # files and still finished in 21s.
      #
      # What IS established, and what this comment is for: **the staircase
      # does not reproduce the wedge**, matching flags or not. Four bisect
      # rounds came back green including both controls, and so did an
      # isolation round where the two wedging shards ran as the only jobs in
      # the run. So the trigger is not another shard competing with them,
      # not the file set at <=12 files (halves and quarters all pass), not
      # test count, and not peak memory (flat at ~98MB). Do not re-run those
      # rounds; the open question is what a 2-CPU Linux runner does that a
      # developer machine does not.
      #
      # ``test_the_bisect_lane_runs_the_shape_it_bisects`` pins the
      # alignment so the harness cannot silently drift lighter again.
      - name: Run staircase shard — ${{ matrix.shard }}
        timeout-minutes: 30
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
          # Where ci_process_guard writes the SIGUSR1 stack dump. Handled by
          # pytest itself, in the workspace, because a dump sent to stderr is
          # swallowed by pytest's per-test fd capture and lost when the shard
          # is killed — see _arm_stack_dump's docstring.
          CI_STACK_DUMP_PATH: pytest-stack-dump-${{ matrix.shard }}.txt
        run: |
          set -o pipefail
          TARGETS="${{ matrix.paths }}"
          LIMIT="${{ matrix.limit_files }}"
          if [ -n "$LIMIT" ]; then
            # Alphabetical prefix of the collected files, so nesting one
            # staircase shard inside a bigger one is a true superset and
            # the two runs are comparable.
            #
            # Two details are load-bearing:
            #
            # * ``-o addopts=`` — pytest.ini sets ``-v``, which turns
            #   ``--collect-only`` into a nested ``<Package>/<Module>``
            #   tree with no ``path::name`` lines to select from.
            # * The file part is taken by STRIPPING from ``::``, never by
            #   matching a trailing ``.py``. A node id's parameters can
            #   themselves contain a ``.py``: the very first staircase
            #   run (35851035325) hit
            #   ``...test_llm_calls_inherit_unified_timeout.py::test_no_
            #   magic_number_timeout_on_llm_calls[agent.py]`` — a
            #   parametrisation over module filenames — and a greedy
            #   ``^tests/[^ ]*\.py`` matched into the parameter, emitting
            #   seven ``...calls[agent.py`` fragments that pytest
            #   rejected with ``ERROR: not found`` and exit 4, so u-200
            #   ran no tests at all (reproduced locally).
            #
            # * The line must actually BE a node id. pytest's warnings
            #   summary emits lines that also start with ``tests/`` —
            #   ``tests/unit/test_agent_no_self_split.py:103:
            #   DeprecationWarning: ...`` — and they contain no ``::``,
            #   so ``sed 's/::.*//'`` passes them through untouched as
            #   targets. Run 35851915784 died on exactly that: u-60 and
            #   u-70 were handed ``...test_agent_no_self_split.py:1``
            #   (and ``:103`` / ``:232``, the line numbers the file cites
            #   in its own docstrings), pytest answered "file or directory
            #   not found", and both shards collected 0 items while
            #   reporting `failure`. Requiring ``.py::`` is what
            #   distinguishes a node id from a warning line.
            #
            # ``awk 'NR<=n'`` rather than ``head -n``: ``head`` closes
            # the pipe as soon as it has enough lines, ``sort`` (still
            # writing) takes SIGPIPE, and ``set -o pipefail`` then fails
            # the step — which is how the run before that one died, with
            # "sort: write failed: 'standard output': Broken pipe".
            echo "staircase: first ${LIMIT} collected file(s) of ${TARGETS}"
            TARGETS=$(./.venv/bin/python3 -m pytest ${{ matrix.paths }} \
                        --collect-only -q -o addopts= -p no:cacheprovider -p no:warnings 2>/dev/null \
                      | grep -E '^tests/[^:]*\.py::' | sed 's/::.*//' | sort -u \
                      | awk -v n="$LIMIT" 'NR <= n' | tr '\n' ' ')
            echo "staircase: resolved -> ${TARGETS}"
          fi
          # The `ci_progress_marker` plugin that used to run here was
          # deleted: it assumed a cancelled job still leaves readable
          # check-run annotations, and that is false. GitHub caps
          # annotations per step (a completed shard surfaced 4, none of
          # them per-test breadcrumbs) and exposes none at all while the
          # job is still in progress (an in-flight wedge read back 0),
          # which is precisely when the breadcrumbs would matter.
          # Same single foreground `timeout` as the unit shards, for
          # the same reason: it guarantees the step ends so the upload
          # runs, and the hand-rolled `setsid` + `tail -f --pid` +
          # `wait` plumbing had four separate ways to fail to end it.
          # `ci_process_guard` still reports a leaking test by name and
          # reaps the survivors — though note that it was never what was
          # killing the shard; see `backend/utils/process.py`.
          WATCHDOG_SECONDS=1500
          set +e
          COVERAGE_FILE=.coverage.staircase-${{ matrix.shard }} \
          timeout --foreground --signal=USR1 --kill-after=30s "$WATCHDOG_SECONDS" \
            ./.venv/bin/python3 -m pytest $TARGETS \
              -m "not e2e and not integration and not time_sensitive and not perf" \
              --cov=. \
              --cov-report= \
              --tb=short \
              -p ci_process_guard \
              -p faulthandler \
              -o faulthandler_timeout=60 \
              --durations=25 \
              --timeout=60 > pytest-${{ matrix.shard }}.log 2>&1 < /dev/null
          RC=$?

          if [ "$RC" -eq 124 ]; then
            {
              echo
              echo "===== shard budget of ${WATCHDOG_SECONDS}s reached; killed ====="
              echo "The output above ends at the last test that STARTED."
            } >> pytest-${{ matrix.shard }}.log
            echo "::error::the ${{ matrix.shard }} shard was killed at its ${WATCHDOG_SECONDS}s budget (rc=$RC). The uploaded log ends at the last test that started; the stack dump names the frame it was stuck in."
          fi

          echo "----- tail of pytest-${{ matrix.shard }}.log -----"
          tail -n 40 pytest-${{ matrix.shard }}.log
          echo "----- end -----"
          exit $RC

      - name: Upload pytest output — ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-staircase-${{ matrix.shard }}
          # See the note on the unit shard's upload: the dump is what says
          # where a reaped shard was stuck.
          path: |
            backend/pytest-staircase-${{ matrix.shard }}.log
            backend/pytest-stack-dump-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # STAGE 2b — COVERAGE GATE (PR gate)
  # The 80% floor used to be enforced by the single unit job. It cannot be
  # enforced per shard (a shard sees a fraction of the suite, so its
  # percentage is meaningless), so each shard uploads its raw coverage data
  # and this job combines them and applies the gate to the union — the same
  # measurement the unsharded job used to produce.
  # ---------------------------------------------------------------------------

  coverage-gate:
    name: Coverage gate (≥80%)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: backend
          merge-multiple: true

      - name: Enforce the combined coverage gate
        working-directory: backend
        run: |
          ./.venv/bin/python3 -m coverage combine
          ./.venv/bin/python3 -m coverage report --fail-under=80

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-pr-${{ github.event.pull_request.number }}
          path: |
            backend/.coverage
            backend/coverage.xml
          # upload-artifact v4.4+ skips dot-prefixed path components
          # unless told otherwise, and reports 'No files were found' —
          # which reads as "the run produced nothing".
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # STAGE 3 — INTEGRATION (PR gate)
  # Depends on unit: if unit fails, integration is skipped. This enforces
  # the "失败时不得继续下一级" boundary.
  # Runs pytest under the project's venv (backend/.venv/bin/python3).
  # ---------------------------------------------------------------------------

  integration-tests:
    name: Integration tests (PR gate)
    runs-on: ubuntu-latest
    # Kept in lockstep with ``unit-tests`` on purpose: the e2e job needs
    # this one, so a divergence here silently removes e2e from the
    # merge gate.
    if: github.event_name == 'pull_request'
    # Chain the layered gates: unit, the combined coverage floor, and
    # grep-guard must all pass before integration runs. If any upstream
    # gate fails (style violation, grep-guard regex hit, unit test
    # failure, or coverage below 80 %) the integration suite is skipped
    # so a developer sees the earliest-detected failure instead of
    # waiting for a slower suite to also fail on the same root cause.
    needs: [unit-tests, coverage-gate]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # Stub integration uses mock LLM/coding-tool to avoid real network calls.
      # Runs only the integration stub tests (NOT e2e).
      - name: Run integration tests (venv Python)
        working-directory: backend
        run: ./.venv/bin/python3 -m pytest tests/integration/ -m "integration and not e2e" --tb=short --timeout=120 --junitxml=integration-junit.xml

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-pr-${{ github.event.pull_request.number }}
          path: backend/integration-junit.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E2E — dry-run (mock plan) only
  # Slim: the mock-plan E2E, gated on the PR. The 1482-test regression
  # suite lives in the nightly cron and is NOT a merge blocker.
  # ---------------------------------------------------------------------------

  e2e-on-demand:
    name: E2E pipeline (mock plan, main release)
    runs-on: ubuntu-latest
    # Per test-design decision point 7: e2e runs on PRs as well as on
    # main, so a broken pipeline is caught before the merge rather than
    # after it. It was main-only while this layer cost ~30 minutes; it
    # now costs 28 seconds for 17 tests, and a merge that turns main red
    # is a revert, not a fix. Manual dispatch still force-runs it for
    # flake investigation.
    #
    # ``not time_sensitive`` keeps out the 26 e2e tests that assert on
    # wall-clock time. They are in the same directory but a different
    # lane: they need the runner to themselves, which is what
    # `existing-test` gives them, and the PR gate here runs beside the
    # unit shards. See the `time_sensitive` marker definition in
    # `backend/pytest.ini`.
    #
    # Default CI behaviour: runs the MOCK-PLAN E2E only. The dangerous
    # REAL-plan migration lives in its own `real-plan-migration` job
    # below, gated behind `inputs.run_real_plan_migration == 'true'` so
    # a routine PR or the nightly cron cannot trigger a real migration.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Chain after the layered gates: the mock-plan E2E is the
    # cheapest of the e2e jobs so it runs by default; a real-plan
    # migration lives behind `real-plan-migration` (gated by the
    # `run_real_plan_migration` workflow_dispatch input below).
    needs: integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # E2E exercises the full pipeline: agent → executor → LLM (stub) →
      # verifier → report. The full pytest suite (1482 tests) used
      # to also run here as a "regression" step, but it pushed the
      # total CI time past 45 minutes — far above the 15-minute
      # budget. The dry-run E2E tests are representative enough of
      # the executor + verifier + report pipeline that we keep just
      # this step; the full 1482-test suite moves to the
      # nightly-regression job (which already runs once a day on a
      # cron and is not blocking).
      - name: Run E2E tests
        working-directory: backend
        run: ./.venv/bin/python3 -m pytest tests/ -m "e2e and not time_sensitive" --tb=short --timeout=600 -v

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-main-${{ github.sha }}
          path: |
            backend/logs/
            backend/.pytest_cache/
          # upload-artifact v4.4+ skips dot-prefixed path components
          # unless told otherwise, and reports 'No files were found' —
          # which reads as "the run produced nothing".
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # STAGE 3b — KEYCHAIN E2E (macOS runner, PR gate)
  #
  # A keychain is a macOS facility. Every other job in this file runs on
  # ``ubuntu-latest``, where ``/usr/bin/security`` does not exist and
  # ``credentials._keychain_available()`` answers False — so the
  # credential suite takes its "this platform has no keychain" branch
  # and passes. That is the correct behaviour for a machine with no
  # keychain, and it is no evidence at all that the real read works: the
  # only assertions that could fail on a defective read never execute.
  #
  # The obvious repair is the wrong one. Marking the tests
  # ``skipif not darwin`` leaves the security acceptance running only on
  # whichever machine the author happens to own — a gate nobody's CI runs
  # is a report, and a report that is green because it did not run is
  # worse than no report. So this is a job on a macOS runner instead,
  # and it is a MERGE GATE: same ``if:`` string as every other gating
  # job, no ``continue-on-error``, and listed in the merge gate's
  # ``needs``. ``backend/tests/static_gates/
  # test_keychain_macos_job_is_a_merge_gate.py`` pins those four
  # properties, because the failure mode — a lane quietly demoted to
  # advisory — is invisible in the job list.
  #
  # Selection is by PATH, not by marker, and deliberately so.
  # ``backend/pytest.ini`` runs ``--strict-markers`` and
  # ``test_ci_lanes_match_marker_contracts.py`` pins one ``-m``
  # expression per job, so a marker for this lane would have to be
  # excluded by the default lanes, collected by some other lane, and
  # registered in a baseline list — three files to keep in sync, in
  # order to name three files that can simply be named here. The
  # ``/proc`` credential probe is a Linux-only shape and stays in the
  # Linux lane; this job is the darwin half of the same coverage.
  #
  # ``needs: [static-gates]`` for the reason every other lane carries it:
  # a macOS runner is the most expensive thing in this workflow, so it
  # must not be started before the contracts have had their say. Wired
  # through the gate rather than the shards so the job is not waiting on
  # twenty of them to say something about three files.
  # ---------------------------------------------------------------------------

  e2e-keychain:
    name: Keychain E2E (macOS runner, real keychain path)
    runs-on: macos-latest
    # A credential defect found on main is a revert; found on the pull
    # request it is a comment, so the gate is on `pull_request`.
    #
    # This predicate was written before the rest of the file was re-rooted
    # onto `pull_request` alone on 2026-10-05, and it kept the older
    # push-to-main clause. The clause is now dead — this workflow has no
    # `push:` trigger — so it is inert rather than wrong, and
    # `test_macos_job_triggers_on_pull_request` only requires that
    # `pull_request` appear in the condition. Narrowing it to match the
    # other gating jobs is a separate, deliberate change; leaving it costs
    # nothing but the reader has to know why the two differ.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [static-gates]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # The credential E2E: a three-level relay of REAL child processes,
      # each of which has to be handed the secret on a descriptor the
      # publisher opened. A mock of ``subprocess`` can only assert that
      # the module called something with some arguments; whether those
      # arguments are a command line that works is a property of the
      # process, not of the call. It spawns interpreters, so it is
      # registered in ``_SUBPROCESS_DRIVERS`` — the list that tells the
      # lane contracts which files must declare the ``integration``
      # marker rather than being collected by a unit shard.
      - name: Run the credential E2E (fd isolation across real processes)
        working-directory: backend
        run: ./.venv/bin/python3 -m pytest tests/integration/test_credentials_fd_isolation.py --tb=short --timeout=300

      # The macOS-only probes. These files are hermetic — they build
      # their stand-in keychain in ``tmp_path`` against a redirected
      # ``$HOME`` and touch no real secret — but what they exercise is
      # the ``sys.platform == "darwin"`` branch of the resolution
      # skeleton, and that branch is dead code on every other runner in
      # this file. Running them here is what makes the branch live.
      #
      # ``test_credentials_security_lookup.py`` covers the read itself
      # (the argv, a nonzero exit for an item that is not there, a
      # trailing newline, a tool that hangs); ``test_secret_launcher_publish``
      # covers what happens when the same lookup is asked twice. That
      # second invariant used to live in ``test_credentials_cache_invariants``,
      # which counted the processes the *server* started — and the server
      # starts none any more, so the counter moved to the launcher, which
      # is the process that reads.
      - name: Run the macOS keychain probes
        working-directory: backend
        run: ./.venv/bin/python3 -m pytest tests/integration/test_credentials_security_lookup.py tests/integration/test_secret_launcher_publish.py --tb=short --timeout=300

      # The whole delivery, end to end, with nothing replaced. The step
      # above proves the command line this repository *believes* in reaches
      # a keychain, because it runs that command line against a stand-in
      # binary. It cannot say the real ``/usr/bin/security`` honours it.
      #
      # This step is the only place in CI that can. It creates a real
      # temporary keychain, files a canary in it, reads it back through the
      # real tool, hands the value to a real child interpreter on a
      # descriptor, and then asks two independent kernel-level probes
      # (``ps eew`` and ``KERN_PROCARGS2``) whether the child's environment
      # carries that canary — each with a positive control, so a probe that
      # has stopped working reports a failure rather than a clean result.
      #
      # Selected by path, like every step in this job: the file declares no
      # marker of its own, and a new marker would be a name the default
      # lanes, the serial lane and a static gate all then have to learn.
      # Pinned by ``test_the_macos_lane_collects_the_whole_delivery_e2e`` in
      # ``tests/static_gates/test_keychain_macos_job_is_a_merge_gate.py`` —
      # the file skips itself off macOS, so a lane that dropped it would
      # leave the acceptance green and unexecuted everywhere.
      #
      # ``--timeout=300`` is per test and matches the two steps above. The
      # job's own ceiling is 20 minutes for every step together, so a budget
      # larger than the room left would mean a wedged test is reaped by the
      # runner — which uploads nothing — instead of failing loudly and
      # reaching the ``if: always()`` upload below. Each case bounds its own
      # waits far below this anyway; it is here to catch what they do not.
      #
      # ``PDT_REQUIRE_KEYCHAIN_E2E`` puts the file in its **strict**
      # position, and that is the whole reason this step is a gate rather
      # than a report. By default the file's capability gate *skips* on a
      # machine that cannot start ``/usr/bin/security`` or ``ps``: the step
      # is green, the summary says nothing ran, and no reader of a green
      # check can tell "six cases passed" from "six cases were absent".
      #
      # Here that default is the wrong one. This is the only lane in the
      # workflow that runs on a runner which *has* a keychain, so a keychain
      # tool that will not start there is a broken lane — a misconfigured
      # image, a policy refusing the binary — and not a fact about the code
      # under test. Silently skipping would convert that misconfiguration
      # into a green acceptance for the credential path, which is precisely
      # the substitution this job exists to prevent. Strict, the same
      # condition fails the case and turns the merge gate red.
      #
      # Off macOS the file still skips, and no lane can overrule that: the
      # switch changes what a *missing capability* means on a machine that
      # should have it, not whether the platform is macOS at all. Hence this
      # step stays on the macOS lane — pinned by
      # ``test_the_e2e_step_sets_the_strict_switch`` and
      # ``test_the_e2e_file_is_not_wired_into_a_linux_job`` in
      # ``tests/static_gates/test_keychain_macos_job_is_a_merge_gate.py``,
      # which read the switch name and its accepted values out of the test
      # file itself rather than from a copy kept here.
      - name: Run the macOS whole-delivery E2E (real keychain, real child, real probes)
        working-directory: backend
        env:
          PDT_REQUIRE_KEYCHAIN_E2E: "1"
        run: ./.venv/bin/python3 -m pytest tests/e2e/test_keychain_full_delivery_macos.py --tb=short --timeout=300

      - name: Upload keychain E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keychain-e2e-report-${{ github.run_id }}
          path: backend/.pytest_cache/
          # upload-artifact v4.4+ skips dot-prefixed path components
          # unless told otherwise, and reports 'No files were found' —
          # which reads as "the run produced nothing".
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # STAGE 4b — SLOW (manual dispatch)
  # Per test-design decision point 7: tests marked ``@pytest.mark.time_sensitive``
  # (long-running stress, soak, or full pipeline sweeps) are split out
  # from the regular suite so they do not block PR throughput. They run
  # on every pull request and on manual ``workflow_dispatch``. The
  # dedicated job keeps that layer's timeout / artifact retention
  # independent from the (faster) e2e job.
  # ---------------------------------------------------------------------------

  existing-test:
    name: Time-sensitive + perf (serial lane)
    runs-on: ubuntu-latest
    # Runs on PRs as well as main. These tests are not slow — the whole
    # set is about 30 seconds — but they are the only tests that must
    # have the machine to themselves, because each one asserts on
    # wall-clock time. "4 VPs in flight finish in 10s, not 40s" is only
    # a claim about the code if the CPU was not being fought over while
    # it was measured.
    #
    # That is what `needs: unit-tests` buys. On a runner, the shards of
    # `unit-tests` run in parallel with anything not chained after
    # them, so without this the assertions below would be measuring
    # scheduler contention. Chaining costs wall-clock — this job cannot
    # start until the shards finish — and buys a verdict that means
    # something.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # Slow layer exercises stress / soak / full-pipeline sweeps gated
      # by ``@pytest.mark.time_sensitive``. 30-minute per-test timeout covers
      # overnight-style scenarios; the global pytest-timeout ceiling
      # is 1800s. Failures block main release.
      - name: Run time-sensitive and perf tests
        working-directory: backend
        run: ./.venv/bin/python3 -m pytest tests/ -m "time_sensitive or perf" --tb=short --timeout=1800 -v --junitxml=timesensitive-junit.xml

      - name: Upload time-sensitive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timesensitive-logs-${{ github.sha }}
          path: |
            backend/timesensitive-junit.xml
            backend/logs/
            backend/.pytest_cache/
          # upload-artifact v4.4+ skips dot-prefixed path components
          # unless told otherwise, and reports 'No files were found' —
          # which reads as "the run produced nothing".
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # NIGHTLY REGRESSION — daily cron, blocks release on failure
  # ---------------------------------------------------------------------------

  nightly-regression:
    name: Nightly regression (daily full suite)
    runs-on: ubuntu-latest
    # Runs on the daily cron schedule, plus ad-hoc workflow_dispatch
    # (with ``layer=nightly``) for manual verification of the runner
    # pool after infrastructure-level failures. ``workflow_dispatch``
    # bypasses the schedule-pool deprioritization that has been
    # causing the cron-triggered job to lose its runner VM at the
    # "Run nightly regression suite" step on a consistent 46-minute
    # pattern (see the 5 consecutive failures logged under runs
    # five consecutive failures). If the manual run also fails, the issue is in
    # the test code or the workflow; if it passes, the issue is
    # specifically the schedule pool.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Hard-cap the job so it fails fast with a clear timeout error
    # (instead of the ambiguous "hosted runner lost communication"
    # at the ~46-minute runner-image hang documented in
    # actions/runner-images#13770). 40 minutes is the unit+integration
    # suite's engineering budget plus CI headroom for the ~3x slowdown
    # observed on the 2-CPU ubuntu-latest runner; the ``e2e``,
    # ``time_sensitive`` and ``perf`` markers are excluded below to keep
    # the actual run well under this cap. The nightly therefore covers
    # the middle of the matrix only — it re-runs what a merge already
    # ran, on days when no merge happened, and is the only signal that
    # the suite is still green without a PR to attribute it to.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # Mitigate actions/runner-images#13770: the Ubuntu 24.04 runner image
      # ships with a ``read_ahead_kb`` value that consumes too much page cache
      # on I/O-heavy jobs (pytest collection, in particular, imports every
      # test module which reads many files). Symptom: the runner dies silently
      # right after ``Run nightly regression suite`` starts, with 0 bytes of
      # pytest output and ``hosted runner lost communication with the server``
      # ~46 minutes later. GitHub shipped a partial fix in image 20260513 that
      # covers ``/dev/sd*`` (SCSI), but ``/dev/nvme*n*`` (NVMe namespaces,
      # used on Azure v5/v6 VM series — which the standard runner-image
      # targets) is NOT yet covered (see PR #13938 and follow-up in the
      # issue thread). Until the upstream fix lands, we explicitly pin
      # ``read_ahead_kb=128`` on every block device before pytest loads.
      - name: Mitigate runner-images#13770 (read_ahead_kb)
        run: |
          sudo bash -c '
            shopt -s nullglob
            for dev in /sys/block/sd* /sys/block/nvme*n*; do
              if [ -e "$dev/queue/read_ahead_kb" ]; then
                echo "  $(basename $dev): $(cat $dev/queue/read_ahead_kb) -> 128"
                echo 128 > "$dev/queue/read_ahead_kb"
              fi
            done
            exit 0
          '

      # Daily regression runs the full automated suite (unit + integration +
      # contract checks). E2E tests that require a local CC Switch DB are
      # left to the main-branch E2E job; the dry-run e2e markers are not
      # included here so the scheduled run stays deterministic in vanilla
      # CI runners. Failures fail the workflow and block release.
      #
      # ``-n 2`` runs pytest across 2 workers (the default ubuntu-latest
      # runner has 2 CPU cores). Locally this cuts runtime from ~5m15s
      # to ~2m20s for 1766 tests (2.3x). On CI the slowdown observed
      # against the 2-core runner image is offset by the parallelism —
      # total runtime is well under the 40-minute job cap.
      - name: Run nightly regression suite
        id: nightly_regression
        working-directory: backend
        run: |
          ./.venv/bin/python3 -m pytest tests/ \
            -m "not e2e and not time_sensitive and not perf" \
            --tb=short \
            --timeout=120 \
            -n 2 \
            -q \
            --junitxml=nightly-regression-junit.xml

      - name: Upload nightly regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-regression-report-${{ github.run_id }}
          path: backend/nightly-regression-junit.xml
          if-no-files-found: warn
          retention-days: 90

      # Surface the result in the run summary so it's visible without
      # opening artifacts. This step only renders on success because the
      # job fails the workflow on regression failures.
      - name: Annotate run summary
        if: success()
        run: |
          {
            echo "## Nightly regression"
            echo
            echo "✅ All nightly regression checks passed"
            echo
            echo "Trigger: schedule (daily 02:00 UTC)"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # REAL PLAN MIGRATION — explicit opt-in only
  #
  # This job runs the REAL plan migration suite (writes to the
  # production ``plans/`` directory and may invoke mocks with side
  # effects). It is gated behind the explicit ``workflow_dispatch``
  # input ``run_real_plan_migration == 'true'`` so it CANNOT run on
  # a routine pull request or the nightly cron.
  #
  # The boolean default for the input is ``false`` (declared in
  # the ``workflow_dispatch.inputs`` block above). A bare "Run
  # workflow" click without explicitly checking the box therefore
  # leaves this job skipped, which is the desired safe default.
  #
  # When ``run_real_plan_migration == 'true'`` is supplied, the
  # job still chains after the layered gates (grep-guard, unit,
  # integration, e2e-main) so a failed gate blocks the dangerous
  # job from running on an already-broken main.
  # ---------------------------------------------------------------------------

  real-plan-migration:
    name: Real plan migration suite (DANGEROUS, opt-in only)
    runs-on: ubuntu-latest
    # Explicit, verbatim string comparison so any non-'true' value
    # (including the boolean default 'false', an unset input, an
    # older boolean-shaped string, or a JSON-friendly 'True')
    # cleanly skips this job. This is the canonical "manual
    # maintenance" dispatch gate that the task brief pins.
    if: github.event.inputs.run_real_plan_migration == 'true'
    # Even when explicitly invoked, the real-plan migration must
    # not run on a tree that already failed the layered gates. The
    # needs-chain enforces: grep-guard (static) + lint + unit +
    # integration + e2e-main (mock plan E2E) all green before the
    # real-plan migration is allowed to start.
    needs: e2e-on-demand
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/uv.lock

      # uv's own cache is a *different directory* from the pip cache
      # setup-python just restored above (~/.cache/uv vs ~/.cache/pip),
      # so without this every job re-downloads every wheel and the sync
      # runs cold — measured 2.0 s where the cached path is 0.19 s.
      #
      # Keyed on the lockfile hash, which this repository now pins, so
      # the entry stays valid across ordinary dependency bumps instead of
      # going stale like a requirements.txt hash would have.
      #
      # actions/cache is GitHub's own action, deliberately not
      # astral-sh/setup-uv: an action that can write into the runner is a
      # supply-chain surface, and this repository's gates are written
      # against exactly one third-party action today.
      - name: Restore the uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install backend dependencies
        # `uv sync` installs backend/uv.lock *and* creates
        # backend/.venv, so this one step is what the old
        # "install requirements" + "bootstrap project venv" pair used
        # to be together. Every lane below runs pytest through
        # backend/.venv/bin/python3 and never the system interpreter.
        #
        # `--locked` is the load-bearing flag: without it uv silently
        # re-resolves instead of installing the lock, which is the
        # dependency drift ENTRY-040 exists to end. uv itself is pinned
        # rather than floating so the resolver is reproducible too.
        run: |
          python -m pip install --upgrade pip
          pip install uv==0.11.6
          uv sync --project backend --locked

      # The actual REAL-plan migration invocation. This writes to
      # the production ``plans/`` directory and may invoke mocks
      # with side effects — that's why the entire job is gated
      # behind the explicit dispatch input above. The pytest call
      # still uses the project's venv Python (CLAUDE.md rule)
      # rather than the system Python on the runner.
      - name: Run REAL plan migration
        working-directory: backend
        run: |
          ./.venv/bin/python3 -m pytest tests/integration/real_plan_migration \
            -m "real_plan_migration" \
            --tb=long \
            --timeout=1800 \
            -v \
            --junitxml=real-plan-migration-junit.xml || true

      - name: Upload real-plan-migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-plan-migration-report-${{ github.run_id }}
          path: backend/real-plan-migration-junit.xml
          if-no-files-found: warn
          retention-days: 365

      # Surface the result in the run summary so the explicit
      # opt-in intent is visible without opening artifacts. The
      # WARNING emoji + "DANGEROUS" label is intentional — anyone
      # reading the run summary should immediately see that this
      # was a manual-dispatch real-plan migration, not a routine
      # pull-request run.
      - name: Annotate run summary
        if: always()
        run: |
          {
            echo "## ⚠️ Real plan migration (manual dispatch, DANGEROUS)"
            echo
            echo "Trigger: workflow_dispatch with inputs.run_real_plan_migration=true"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This run explicitly opted in to a REAL plan migration via the"
            echo "\`run_real_plan_migration\` workflow_dispatch input. The job"
            echo "was permitted to write to the production \`plans/\` directory."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # STAGE 5 — MERGE GATE
  #
  # The single job branch protection requires. Everything above it can be
  # red; this one is what turns "a red badge" into "you cannot merge".
  #
  # WHY THIS JOB HAS TO EXIST — the skipped-is-green trap
  # ----------------------------------------------------
  # GitHub evaluates a required status check as PASSING when its conclusion
  # is `success` **or `skipped` or `neutral`**. So a job that depends on a
  # failed job does not report a failure — it is skipped, the skip counts
  # as success, and the pull request merges anyway:
  #
  #     unit-tests (a shard goes red)
  #       └─ coverage-gate      → skipped → counts as SUCCESS  ← hole
  #       └─ integration-tests  → skipped → counts as SUCCESS  ← hole
  #     required_status_checks: satisfied. Merge proceeds with a red suite.
  #
  # Requiring the downstream jobs therefore does NOT transitively require
  # the upstream ones, which is the intuitive reading and the wrong one.
  # This is not hypothetical: it is what the previous required-check set
  # did, configured in the belief that the `needs:` chain closed it.
  #
  # The fix is `if: always()` — the gate runs even when its dependencies
  # were skipped — plus a body that inspects `needs.*.result` and fails on
  # anything that is not `success`. A skipped dependency is NOT tolerated
  # here either: for these ten jobs a skip on a pull request means
  # something upstream went wrong or an `if:` was narrowed, and in both
  # cases the honest answer is "this gate is not covered", not "fine".
  #
  # Deliberately NOT in `needs`: unit-staircase, nightly-regression,
  # real-plan-migration. Those are dispatch/schedule-only by design, so
  # requiring them would wedge every merge on a check that never reports
  # on a pull request — a merge blocker that can never be satisfied.
  # tests/static_gates/test_merge_gate_contract.py pins that split.
  # ---------------------------------------------------------------------------

  merge-gate:
    name: Merge gate (all PR jobs green)
    # `always()` is load-bearing and must not be dropped. Without it this
    # job inherits the skip that it exists to detect, and a skip counts
    # as a pass — the gate would invert from broken-but-green to
    # green-while-broken in exactly the case it was added for.
    #
    # `pull_request` ONLY, and that is deliberate (2026-10-05). This job
    # aggregates the pull request's jobs, so a manual dispatch has nothing
    # for it to aggregate — and the two rules above, applied to a dispatch,
    # produce a guaranteed red: every one of those jobs is
    # `pull_request`-only, so all eleven report `skipped`, and `skipped`
    # is not `success`. The run would be red whatever the tree contained,
    # which is worse than useless — a maintainer running one layer by hand
    # sees a closed gate and has to work out that "skipped" meant "you did
    # not ask for this", not "this is broken".
    #
    # The dispatch trigger itself stays, and so does the one thing only it
    # can do: `inputs.staircase` drives the `unit-staircase` job, the
    # wedge bisection for a shard that hangs the runner. Runs 36576222631
    # and 36708885554 are the two that used it, and they are the reason
    # the trigger exists.
    if: always() && github.event_name == 'pull_request'
    needs:
      - lint
      - grep-guard
      - commit-hygiene
      - commit-range-privacy
      - pr-metadata-privacy
      - static-gates
      - unit-tests
      - coverage-gate
      - integration-tests
      - e2e-on-demand
      - e2e-keychain
      - existing-test
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every upstream job succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "Dependency results for this run:"
          echo "${NEEDS_JSON}" | python3 -m json.tool
          echo
          echo "Full log: ${RUN_URL}"
          echo

          # Prints the job count on success, the offending jobs on
          # failure. It is one program because both answers come from the
          # same parse — and printing the count from here rather than
          # from bash is the point: `${#NEEDS_JSON}` is the length of the
          # JSON *string* in bytes, so the summary used to announce "All
          # 620 upstream jobs" for a nine-job gate. A number in a gate's
          # own output has to be the number it means.
          summary="$(NEEDS_JSON="${NEEDS_JSON}" python3 - <<'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          # Anything other than `success` blocks. `skipped` is included
          # on purpose: see the job comment — for these ten jobs a skip
          # on a pull request is a broken gate, not a satisfied one.
          bad = {
              name: result.get("result")
              for name, result in sorted(needs.items())
              if result.get("result") != "success"
          }
          if not bad:
              print(f"{len(needs)}")
              sys.exit(0)
          print("These jobs did not succeed, so the merge gate is closed:")
          for name, result in bad.items():
              print(f"  ✗ {name}: {result}")
          sys.exit(1)
          PY
          )" || {
            echo "$summary"
            echo
            echo "::error::Merge gate closed — see the list above."
            exit 1
          }

          echo "All ${summary} upstream jobs succeeded — merge gate open."

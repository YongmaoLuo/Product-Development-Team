[pytest]
# Pytest Configuration for autonomous-coding project
# Feishu integration test suite. Backend internal tests
# (test_agent.py, test_coding_tool.py, test_verification_agent.py) are excluded — they
# require the `claude` / `opencode` CLIs which are not available
# in this environment.

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Global per-test timeout. This mirrors ``backend/pytest.ini``, which
# already carried it: the 40286 incident (Sept 2026) showed that a hung
# pytest can grow its stderr capture file to 30+ GB and pin SQLite WAL
# writers indefinitely — a hard cap turns "silent hang for hours" into
# "loud failure in 5 min" so the watchdog / supervisor can reap the
# orphan pytest instead of leaving it to rot on the next restart.
# Which config pytest resolves depends on the invocation's rootdir, so a
# cap that lives in only one of the two files protects only half of the
# invocations: this file is the one resolved when pytest runs from the
# repo root (no target, or a target outside ``backend/``), while the
# CI shards and scripts/run_tests.sh point at ``backend/tests`` and
# resolve ``backend/pytest.ini``.
# ``thread`` method works on macOS (the ``signal`` method needs SIGALRM
# which Python disables under threading); pytest-timeout falls back
# automatically on platforms where signal is unsupported.
# pytest-timeout is already a backend dependency (backend/pyproject.toml
# pins ``pytest-timeout>=2.3``); this entry just enables the plugin.
timeout = 300
timeout_method = thread

# Add current directory and backend/ to Python path for imports.
#   - backend/ is needed so tests can do
#     `from client import BackendApiClient` and so on.
pythonpath =
    .
    backend

# Warning settings
filterwarnings =
    # Ignore urllib3/LibreSSL warnings (not critical for tests). The warning
    # class name varies across urllib3 versions (``NotOpenSSLWarning`` only
    # exists in urllib3 v2.x); matching by message regex avoids an
    # ``AttributeError: module 'urllib3.exceptions' has no attribute
    # 'NotOpenSSLWarning'`` at pytest startup when the runner's urllib3 is
    # older than the one referenced in the filter.
    ignore:.*urllib3 v2 only supports OpenSSL.*:Warning:urllib3

# Test markers
markers =
    unit: Pure unit tests with no subprocess / network / filesystem side-effects. Default layer for the PR gate.
    integration: Tests that require external API calls or real services
    time_sensitive: Tests that assert on wall-clock time (parallelism, lock serialisation, sleep-based soak). Must run alone on the runner; not necessarily slow.
    e2e: End-to-end browser tests using Playwright, or end-to-end pipeline tests using dry-run fake backends
    perf: Performance and wall-clock-parallelism tests that assert on time bounds
    observational: Measurement-only cases that CHARACTERISE a behaviour instead of asserting a contract, and skip when the artefact they measure is absent rather than faking a pass. The default PR shards exclude them; the nightly lane runs them.
    real_model: Cases that really call a model through a live provider (the claude CLI plus ANTHROPIC_*), so CI skips them — see backend/tests/conftest.py. Only a lane that asks for the marker by name really runs them. The name is deliberately unlike any test/class name: pytest's -m also matches name keywords, so a marker named "llm" would silently drag in every test whose name mentions LLM.
    needs_real_process: Cases that drive a real server / real subprocess / real repository rather than a fixture double, so they need a quiet machine and a port to themselves. The default PR shards exclude them; the verification lane runs them serially.
    asyncio: Async tests using pytest-asyncio
    vendor_b_exhausted: Provider fallback E2E where one provider is marked exhausted (selection keyword for verification points)
    fallback_vendor_c: Provider fallback E2E asserting the chain lands on a second provider (selection keyword for verification points)
    vendor_a_pro_exhausted: Provider fallback E2E where the first provider is marked exhausted (selection keyword for verification points)
    fallback_vendor_b: Provider fallback E2E asserting the chain lands on a third provider (selection keyword for verification points)
    recovery_vendor_a_pro: Provider fallback E2E asserting recovery to the first provider after clearing exhausted markers (selection keyword for verification points)
    # ------------------------------------------------------------------
    # Markers used by the tests that live under backend/tests/ but are
    # also collected when the root config is in effect (running pytest
    # from the repo root). ``backend/pytest.ini`` already declares all of
    # these; the root config was never kept in sync, so ``--strict-markers``
    # aborted collection for 21 modules with
    # "'bug_2' not found in `markers` configuration option".
    # Keep this block identical to ``backend/pytest.ini``'s marker list.
    # "Identical" is enforced, not merely intended:
    # ``backend/tests/unit/test_pytest_config_parity.py`` parses both
    # files and pins the difference between the two marker *sets* — the
    # root registry must know every marker the backend registry knows,
    # and every marker it knows alone must be named there, with the two
    # the suite actually carries (``observational`` and
    # ``needs_real_process``) registered at runtime by the module that
    # carries them.  The drift that check was written for was in the
    # other direction — the root config carried those two and
    # ``backend/pytest.ini`` did not, so a case using them aborted
    # collection under the config the gate actually resolves.
    files_to_modify: Tests covering SubTask.files_to_modify validation semantics.
    bug_1: Cross-table isolation — execution writes must not touch verification rows.
    bug_2: Concurrent start CAS guard — second start_execution/start_verification must 409.
    bug_3: Crash-recovery commit boundary — kill between BEGIN IMMEDIATE and COMMIT must leave no trace, kill after COMMIT must persist.
    bug_4: Scheduler re-reads external DB change — no in-memory _pending_*/_cache allowed.
    bug_5: Concurrent verdict append atomicity — append_verdict under contention must not lose updates.
    acceptance_1: 8001 full plan lifecycle E2E (placeholder; L5 task).
    acceptance_2: Two concurrent executions and one verification coexist (placeholder; L5 task).
    acceptance_3: Crash recovery covers mid_execution and mid_verification.
    acceptance_4: No state JSON filenames anywhere in production code.
    # ``acceptance_5`` is deliberately NOT registered: its only consumers
    # live in ``backend/tests/regression/``, which is excluded from this
    # repo because those tests import the private ``tools/`` subsystem.
    # A marker with no cases fails
    # ``meta_tests::test_every_acceptance_marker_has_at_least_one_case``,
    # so re-adding the marker means re-adding its tests too.
    acceptance_6: 8000 plan states unchanged before/after refactor (placeholder; L5 task).
    acceptance_vp017: VP-017 acceptance gate — 9 consumer modules reach the state machine through repositories directly.
    api_error_matrix: VP-018 9x5 API error code matrix.

# Test output options
addopts =
    -v
    --strict-markers
    --tb=short
    --ignore=backend/tests/test_agent.py
    --ignore=backend/tests/test_coding_tool.py
    --ignore=backend/tests/test_verification_agent.py
    -p no:cacheprovider
    # The wall-clock cases must run alone — `backend/pytest.ini` has this
    # line and this file did not, so a run that resolved *this* config
    # dragged them into the parallel lane: `test_backend_startup_latency_
    # within_10ms` measured 9267 ms against a 4661 ms baseline (the
    # runner's load, not the code) and an e2e case blew its fixed 30 s
    # server-start budget. Which config pytest resolves depends on the
    # invocation's rootdir, so the exclusion cannot live in only one of
    # the two files.
    -m "not time_sensitive"

# Coverage options (when using pytest-cov)
# [pytest-cov]
# cov = .
# cov_report = term-missing

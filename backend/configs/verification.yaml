# Verification Configuration
# =========================
#
# Per-method timeout and parallelism configuration for the
# VerificationAgent.
#
# 2026-09-13: the per-VP ``timeout_seconds``
# interface was DELETED. The enforcement layers are exactly two:
#   - 1-hour outer cap: flat ``HARD_WALL_CLOCK_CAP_SECONDS=3600`` in
#     VerificationSubAgent (no per-VP scaling, no multiplier, no grace)
#   - 15-min inner idle: ``coding_tool._total_timer`` (fires when
#     subprocess stdout is silent for 15 min — emits HardTimeoutError)
#
# The values below are surface metadata for ``vp_start`` events and
# always equal 3600. They are NOT read as per-VP overrides anymore.
# Do NOT set them below 3600.
#
# Loaded by:
#   - backend/verification_config.py (TimeoutPolicy.from_yaml)
#   - backend/config_registry.py (registered as 'verification')

execution:
  # Surface metadata only (vp_start event observability), NOT
  # enforcement. A missing key falls back to the global default.
  per_method_timeout_seconds:
    ui_validation: 3600      # 1-hour cap
    code_review: 3600        # 1-hour cap
    api_test: 3600           # 1-hour cap
    # 2026-09-18: Phase 2 的两种全量关卡。``automated_test`` 已于同日退役
    # —— 留着它会让 vp_start 事件报一个不存在的 method。注意这里的值只是
    # "扁平一小时"契约的同一份值；整仓命令真正的时长约束是 VP 自己的
    # ``ci_timeout_seconds``，不是这一层。
    e2e: 3600                # 1-hour cap
    full_ci: 3600            # 1-hour cap

  # FALLBACK width: how many verification points one method-group runs in
  # parallel when nothing can be measured.
  #
  # It used to be the throttle. It is not any more. The width a run
  # actually uses is derived from the verification scene's own providers —
  # each declared cap, scaled by how much of that provider's 5-hour window
  # is left — using the same quota reading the dispatch path is handed, and
  # it is re-read every time it binds rather than frozen at construction.
  # See ``verification_agent._verification_vp_capacity`` and
  # ``dynamic_provider_concurrency.fleet_capacity``.
  #
  # So this number now applies in exactly one case: the scene's chain
  # cannot be resolved at all (CC Switch unreachable, no tier matching). It
  # is deliberately NOT the number "0 providers available → run 4": a
  # measured zero is a real answer from the meters and is used as one, so a
  # fleet that is entirely shut admits nothing rather than dispatching four
  # verification points into a window that is closed.
  #
  # Two bounds still nest, and while the scene resolves they are the *same
  # figure*: one group gate, one plan-wide gate, both sized from the live
  # fleet. The plan-wide layer exists so per-group fan-outs cannot multiply
  # past the number of slots the providers actually have; see
  # ``verification_agent._plan_wide_vp_cap`` for what it falls back to.
  parallelism_cap: 4

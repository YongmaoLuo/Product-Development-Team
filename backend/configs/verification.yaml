# Verification Configuration
# =========================
#
# Per-method timeout and parallelism configuration for the
# VerificationAgent.
#
# 2026-09-13: the per-VP ``timeout_seconds``
# interface was DELETED. The enforcement layers are exactly two:
#   - 1-hour outer cap: flat ``HARD_WALL_CLOCK_CAP_SECONDS=3600`` in
#     VerificationSubAgent (no per-VP scaling, no multiplier, no grace)
#   - 15-min inner idle: ``coding_tool._total_timer`` (fires when
#     subprocess stdout is silent for 15 min — emits HardTimeoutError)
#
# The values below are surface metadata for ``vp_start`` events and
# always equal 3600. They are NOT read as per-VP overrides anymore.
# Do NOT set them below 3600.
#
# Loaded by:
#   - backend/verification_config.py (TimeoutPolicy.from_yaml)
#   - backend/config_registry.py (registered as 'verification')

execution:
  # Surface metadata only (vp_start event observability), NOT
  # enforcement. A missing key falls back to the global default.
  per_method_timeout_seconds:
    ui_validation: 3600      # 1-hour cap
    code_review: 3600        # 1-hour cap
    api_test: 3600           # 1-hour cap
    # 2026-09-18: Phase 2 的两种全量关卡。``automated_test`` 已于同日退役
    # —— 留着它会让 vp_start 事件报一个不存在的 method。注意这里的值只是
    # "扁平一小时"契约的同一份值；整仓命令真正的时长约束是 VP 自己的
    # ``ci_timeout_seconds``，不是这一层。
    e2e: 3600                # 1-hour cap
    full_ci: 3600            # 1-hour cap

  # 2026-10-13: ``parallelism_cap`` is REMOVED, and this is the hole it
  # left.
  #
  # It was the throttle for a while, then the "fallback width" for a
  # verification scene whose chain could not be resolved. Both roles were
  # a number nobody could measure: the round's real concurrency is decided
  # per dispatch by ``acquire_provider_with_dynamic_capacity``, which
  # hands out a provider slot or does not, from the fleet as it stands at
  # that moment — before the ``claude`` subprocess is spawned, so the pool
  # bounds the LLM calls and the subprocesses together.
  #
  # There is consequently nothing left here to configure, and a stale
  # ``parallelism_cap`` in this file would be read by nobody and believed
  # by whoever opens it next.
  #
  # To change how many verification points run at once, change the
  # provider capacity the dispatch path reads — per-provider caps and
  # remaining 5-hour budget — not this file.

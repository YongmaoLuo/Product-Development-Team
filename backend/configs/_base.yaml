# Base Configuration
# Contains common prompts and settings shared by all domain configurations
# This file is automatically merged with domain-specific configs
#
# Fields starting with underscore (_) are internal components used to build prompts.
# Domain configs can reference these components and add their own domain-specific content.

# =============================================================================
# INTERNAL COMPONENTS (used to build prompts, not exposed directly)
# =============================================================================

# Common Task ID Rules (used in planner and refiner prompts)
_task_id_rules: |
  IMPORTANT: Task IDs must follow a hierarchical format using strings:
  - First-level tasks use simple numeric IDs: "1", "2", "3", ...
  - If a task needs to be broken into subtasks, use "-" to connect the original ID with the subtask ID:
    - Task "1" broken into 3 subtasks -> "1-1", "1-2", "1-3"
    - Task "1-1" broken into 2 subtasks -> "1-1-1", "1-1-2"
  - Task IDs must always be unique strings

# Common JSON output format for planner
# (model_type rule: see _planner_json_format below near model_map for full
#  description of complex vs medium selection.)

# Common file output format for executor
_executor_file_format: |
  Provide a list of files to be created or modified, with their FULL content.
  IMPORTANT: All file paths must be RELATIVE to the project directory. Do NOT use absolute paths.
  Format:
  FILE: path/to/file
  ```
  content
  ```
  FILE: path/to/another_file
  ```
  content
  ```

# Common refiner failure handling rules
_refiner_failure_rules: |
  SPLIT GATE — READ THE [FAILURE CLASSIFICATION] BLOCK FIRST.
  The refinement context carries a block with `kind`, `signature`,
  `occurrences_in_lineage` and `split_allowed`.
  1. If `split_allowed` is false, do NOT split. Keep the task as a single
     item (you may clarify its description or test_command), and say in the
     description that an operator should look at it.
  2. Only when `split_allowed` is true may you replace the failed task with
     smaller subtasks.
  3. `kind: report_format` means the previous answer's evidence or report
     shape was rejected — the code may already be correct. Do not treat it
     as evidence that the task is too large.
  4. `kind: infra` (timeouts, provider errors) is not a task-decomposition
     problem. Do not split it.
  5. "Do not split" always wins over any instruction below that says to
     break down a failed task.
  6. kind: lock_conflict — two tasks contended for the same files. Splitting
     the task does not remove the contention; the declaration or the
     schedule must change. Do not split.
  7. kind: undeclared_write — the task tried to write a path it did not
     declare, and the write was refused. Do not split the task into smaller
     versions of the same work. Instead add ONE targeted task whose
     files_to_modify names exactly the refused path (taken from the
     classification block's `detail`), with a description of the specific
     change it must make. Make it a dependency of the original task if the
     original work cannot continue until that file is touched; otherwise
     leave both pending and independent. The original task may then run
     again with its unchanged declaration.
  If the context does NOT contain a [FAILURE CLASSIFICATION] block, this is a
  timeout / legacy refinement: keep the historical rule below and break the
  task down when smaller subtasks can plausibly help.

  IF `split_allowed` IS TRUE, you MUST:
  1. Analyze the error output and the implementation attempt to understand the root cause.
  2. Break down the failed task into smaller, more manageable, and more specific subtasks that address the root cause of the failure.
  3. Generate hierarchical IDs for the new subtasks. For example, if task "2" failed, create subtasks like "2-1", "2-2", "2-3".
  4. Replace the failed task with the new subtasks in the task list.

  WHAT YOU ARE SHOWN:
  - The task list you receive gives the LAST task in full — that is the one being refined. Every other task is reduced to an index row of id/title/status/depends_on. You cannot see the other tasks' descriptions, and you must not try to rewrite them.
  - Because the framework preserves every task you do not mention, your answer is a DELTA: only the tasks you changed or added. Do not echo the rest of the list back.

  CRITICAL PRESERVATION RULES (READ THESE FIRST):
  - DO NOT remove tasks unrelated to the current failure. Only the failed task and its hierarchical descendants may be removed/replaced.
  - If a task's title and description do not relate to the failed task's domain, PRESERVE it verbatim (same id, title, description, status, project_dir, test_commands) — which now costs you nothing: simply do not mention it.
  - Tasks with IDs not derived from the failed task ID (e.g. task "17" or task "18" when task "15" failed) MUST be preserved unless they are explicitly a descendant of the failed task.
  - User-added tasks (introduced after the initial plan was generated) represent explicit user requirements and MUST be preserved.
  - When in doubt: PRESERVE rather than delete. Cleaning up "redundant" tasks is a destructive operation that loses user intent; defer that judgment to a human reviewer.

  FILE DECLARATION RULES (READ THESE FIRST):
  - EVERY task you return MUST carry a "files_to_modify" field. It is the task's write contract, not advice: the executor's file-lock hook and its Edit/Write guard both read it, and a task whose declaration is not a concrete list of paths is treated as READ-ONLY — its sub-agent is refused every file write, and the files it really needed to change are never locked against a sibling task that also reaches for them.
  - Write the files the task WILL modify, as paths relative to the project directory.
  - A task that genuinely only reads — investigation, audit, locating a symbol, settling a question from code that already exists — MUST say so explicitly as ["__NO_FILE_CHANGES__"].
  - Do NOT omit the field, do NOT emit an empty list [], and do NOT write the placeholder "__UNKNOWN_MODIFICATIONS__". Each of those is an undeclared list: it is rejected, and you pay a correction round for it.

# Common refiner JSON format
_refiner_json_format: |
  Return ONLY the tasks you changed or added, in this JSON format. Every task you do not mention is preserved exactly as it is by the framework, so you neither need to copy unrelated tasks back nor should you — echoing them is wasted output and a chance to corrupt one. (A reply that does contain the whole table is still accepted and still means "this is the task list", so an echo is never an error.)
  {
    "tasks": [
      {
        "id": "1",
        "title": "Short title",
        "description": "Detailed description",
        "test_command": "Command to verify",
        "files_to_modify": ["path/to/file.py", "path/to/another.py"],
        "model_type": "complex | medium",
        "status": "pending/completed/failed/in_progress",
        "updated_time": "ISO8601 timestamp or null"
      }
    ]
  }
  IMPORTANT: You MUST preserve these metadata fields from any task you DO return:
  1. "status" - Do not change the status of completed tasks
  2. "updated_time" - Always preserve this field if it exists
  3. "model_type" - Preserve if set; for new/replacement tasks choose by complexity
  "files_to_modify" is REQUIRED on every task above: a list of the relative paths that task will modify, or exactly ["__NO_FILE_CHANGES__"] when the task is read-only. An omitted field, an empty list [], and the placeholder "__UNKNOWN_MODIFICATIONS__" are all undeclared and are rejected.
  When splitting a task, return the new subtasks and OMIT the parent — the parent is replaced by its children, not kept beside them.

# Common task JSON format for execution tasks (planner + repair generator)
_planner_json_format: |
  Output the result in the following JSON format:
  {
    "tasks": [
      {
        "id": "1",
        "title": "Short title",
        "description": "Detailed description of what to do",
        "test_command": "The shell command to run to verify this subtask",
        "model_type": "complex | medium"
      }
    ]
  }

  model_type choice rules:
  - **complex** (complex tasks) - multi-file coordination, state machines, concurrency/resource management, protocol parsing, debugging complex bugs, MCP operations (e.g. puppeteer end-to-end verification, browser automation), cross-service integration, framework design
  - **medium** (medium tasks) - templated CRUD, single-file modifications, pure queries, clear bug fixes (diagnosis already clear), routine import/format corrections

  Experience: implementation tasks in the execution phase are usually medium; end-to-end puppeteer verification tasks in the verification phase must be complex (operating MCP is a high-difficulty action).


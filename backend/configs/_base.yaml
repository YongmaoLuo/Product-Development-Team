# DEFAULT SETTINGS (can be overridden by domain configs)
# =============================================================================

# Default behavior settings
max_retries: 2
background_task_timeout: 180

# Default file patterns (catch-all)
file_patterns:
  - "*"

# =============================================================================
# PROVIDER DEFINITIONS — MOVED OUT OF THE REPOSITORY (2026-09-24)
# =============================================================================
# This file used to declare a ``providers:`` block mapping a locally-invented
# provider id (``vendor-a-pro``, ``vendor-b-pro``, ...) onto the row name that
# provider has in the operator's CC Switch database.
#
# That is gone, and nothing reads it. Two reasons:
#
#   1. **The id was redundant.** Scene routing already selects providers by
#      REGEX OVER THEIR NAMES (see ``provider_routing.yaml``), so the name is
#      the identity. A second, locally-invented key alongside it meant every
#      provider had to be declared twice and the two could drift while both
#      looked authoritative.
#
#   2. **It does not belong in a shipped file.** Which providers exist is a
#      property of one operator's machine, not of this project. Compiling a
#      provider set into the file every user downloads publishes one person's
#      setup as though it were everyone's, and silently routes anyone who
#      never edited it.
#
# WHERE PROVIDER CONFIGURATION LIVES NOW — ``<repo>/.config/``:
#
#   * ``provider_routing.yaml`` — maps workflow scenes onto the ``high`` /
#     ``medium`` / ``low`` tiers, each tier a list of regexes matched against
#     provider names. This is the whole configuration.
#   * With no CC Switch installed, there is nothing to configure: leave
#     ``.config/`` empty and the backend runs on your own Claude Code setup
#     (``~/.claude/settings.json`` and the ``ANTHROPIC_*`` variables) without
#     managing it.
#
# Templates for both files ship in ``<repo>/example/`` — copy one into
# ``.config/`` and rename it to the real filename to activate it. See
# README.md for the directory tree.
# =============================================================================

# =============================================================================
# MODEL MAP — REMOVED (2026-09-13)
# =============================================================================
# The tiered model_map (complex/medium → provider → model) has been
# removed. Model management is delegated ENTIRELY to CC Switch: each
# provider row in the CC Switch database carries its own complete
# ANTHROPIC_* env block (base URL, credentials, and model names), which
# the backend forwards verbatim to the sub-agent subprocess.
#
# Which providers a given workflow phase may use is now decided by
# provider_routing.yaml (scene → tier → regex over CC Switch display
# names). See backend/provider_routing.py.
# =============================================================================

# the backend configuration.
#
# This file declares ancillary process definitions that the
# FastAPI server reads at startup. The fields here are intentionally
# kept thin — most provider / model configuration still lives in
# backend/configs/_base.yaml (the domain-specific config layer).
#
# The provider fallback chain is **not** configured here. It is asked of
# CC Switch at startup — over its HTTP provider list, whose order is the
# operator's own — so there is no path in this file that could point the
# backend at a different chain than the one the operator is looking at
# in CC Switch.
#
# Resolution rules
# ----------------
# * ``subsidiary_processes`` lists long-running subprocesses that the
#   server brings up during the FastAPI lifespan, in order. It is empty
#   by default: this repository ships the mechanism, not any particular
#   fleet. Operators add their own entries.
#
#   Two properties of the mechanism are load-bearing and worth keeping
#   in mind when adding entries:
#     - a failed start aborts uvicorn startup (strong-consistency
#       guarantee), unless the entry is marked ``optional: true``;
#     - entries start in list order, so a producer must precede anything
#       that consumes what it writes.

# Long-running subsidiary processes supervised by the FastAPI lifespan.
#
# Each entry maps a logical name to a launch spec:
#
#   subsidiary_processes:
#     - name: my-service
#       cmd: ["/abs/or/relative/python", "path/to/main.py"]
#       cwd: ".."                     # relative to backend/
#       ready_file: state/ready.json  # optional; supervisor waits for it
#       optional: true                # optional; default false
#       restart_on_crash: true
#       poll_interval_sec: 3
#
# Empty here by design.
subsidiary_processes: []

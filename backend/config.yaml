# the backend configuration.
#
# This file declares ancillary process definitions that the
# FastAPI server reads at startup. The fields here are intentionally
# kept thin — most provider / model configuration still lives in
# backend/configs/_base.yaml (the domain-specific config layer).
#
# The provider fallback chain is **not** configured here. It is asked of
# CC Switch at startup — over its HTTP provider list, whose order is the
# operator's own — so there is no path in this file that could point the
# backend at a different chain than the one the operator is looking at
# in CC Switch.
#
# Resolution rules
# ----------------
# * ``subsidiary_processes`` lists long-running subprocesses that the
#   server brings up during the FastAPI lifespan, in order. It is empty
#   by default: this repository ships the mechanism, not any particular
#   fleet. Operators add their own entries.
#
#   Two properties of the mechanism are load-bearing and worth keeping in
#   mind when adding entries:
#     - a failed start aborts uvicorn startup (strong-consistency
#       guarantee), unless the entry is marked ``optional: true``;
#     - entries start in list order, so a producer must precede anything
#       that consumes what it writes.

# Long-running subsidiary processes supervised by the FastAPI lifespan.
#
# Each entry maps a logical name to a launch spec:
#
#   subsidiary_processes:
#     - name: my-service
#       cmd: ["/abs/or/relative/python", "path/to/main.py"]
#       cwd: ".."                     # relative to backend/
#       ready_file: state/ready.json  # optional; supervisor waits for it
#       optional: true                # optional; default false
#       restart_on_crash: true
#       poll_interval_sec: 3
#
# Empty here by design.
subsidiary_processes: []

# The scheduler's own settings.
#
# The scheduler reads this section and keeps it as one snapshot, taking a
# new one when the file changes (see backend/plan_scheduler/config.py).
# The section is deliberately absent from every API and from the
# frontend: the rollback switch lives here and nowhere else.
#
#   scheduler:
#     enabled: false               # the rollback switch — false stops scheduling
#     dry_run: false               # decide only: write nothing, start nothing
#     capacity: 4                  # how many plans may run at the same time
#     min_runtime_seconds: 0       # how long a young run is left alone (0 = none)
#     tick_seconds: 5              # how long one tick waits before the next
#     command_timeout_seconds: 30  # how long a single command may take
#
# `enabled` is false so that a fresh checkout never runs the new
# scheduler next to the old cron: turning the scheduler on is a
# deliberate act, and turning it off is the way back.  A missing section
# or a missing key leaves that setting on the loader's own default.
#
# `min_runtime_seconds` is 0, so no run is protected on age alone: the
# plan that has run the shortest is the one the scheduler interrupts
# first.  A young run is protected only when an operator asks for it by
# setting this to a number of seconds.
scheduler:
  enabled: false
  dry_run: false
  capacity: 4
  min_runtime_seconds: 0
  tick_seconds: 5
  command_timeout_seconds: 30

# The framework-fix lane's settings.
#
# The section is optional: a file without it runs the lane on the
# defaults below, and a file that names some of the settings leaves the
# rest on their defaults too.  A setting whose value cannot be used —
# a capacity of zero, say — is refused outright rather than being
# quietly replaced, so a mistake is found where it was written.
#
#   framework_fix:
#     max_active: 2               # active fix plans allowed at the same time
#     max_per_repo: 2             # fix plans allowed per framework repository
#     oversubscribe: 1            # slots that may be taken beyond the ceiling
#     repro_runs: 2               # rounds one signature may be fixed in
#     merge_reminder_minutes: 30  # how often an unapproved merge is announced again
#     waiting_on_user_merge_hours: 2  # how long an unapproved merge waits before it escalates
#     deadlock_minutes: 10        # a fix plan with no execution path for this long escalates
#     auto_merge: false           # merge a fix plan's work without asking — off by default
framework_fix:
  max_active: 2
  max_per_repo: 2
  oversubscribe: 1
  repro_runs: 2
  merge_reminder_minutes: 30
  waiting_on_user_merge_hours: 2
  deadlock_minutes: 10
  # Merging a fix plan is the operator's decision, so the switch is off
  # unless the operator turns it on — and only the boolean `true` turns
  # it on.  A missing key, an empty value or a quoted "true" leaves it
  # off: this switch is the one setting here whose wrong answer
  # touches somebody else's repository.
  auto_merge: false
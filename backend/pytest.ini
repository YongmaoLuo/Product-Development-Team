[pytest]
# Backend-local pytest configuration for unit tests that run with cwd=backend/.
#
# WHICH CONFIG GOVERNS WHAT
#   * ``scripts/run_tests.sh`` points pytest at ``backend/tests``, so a
#     gate run resolves THIS file — not the repo-root ``pytest.ini``.
#     The root config's ``timeout = 300`` does not protect the gate;
#     this file's does.  (VP-026 already lost a round to that.)
#   * A run started from the repo root (no target, or a target outside
#     ``backend/``) resolves the repo-root ``pytest.ini`` instead.
#
# THE MARKER LIST IS FROZEN — AND WHAT BRIDGES THE GAP
#   The two configs describe the SAME suite, so a marker the suite
#   carries has to be usable under BOTH of them: both run with
#   ``--strict-markers``, and pytest checks a marker at the moment it is
#   used (``pytest.mark.<name>``), so a case carrying a marker the
#   governing config does not declare aborts collection for its whole
#   module — pytest reports "not found in `markers` configuration
#   option", collects nothing from that module, and the run looks green
#   over an empty room.
#
#   This file's marker list cannot simply grow: it is frozen by
#   ``backend/tests/static_gates/test_keychain_macos_job_is_a_merge_gate.py``,
#   which requires it to equal a written-down baseline exactly.  The two
#   markers the suite carries that the root config declares and this one
#   does not — ``observational`` and ``needs_real_process`` — are
#   therefore registered with the live pytest config by the modules that
#   carry them, before they use the marker (the pattern
#   ``backend/tests/integration/test_context_pack_reduces_exploration.py``
#   established for ``observational``).  That keeps the collection
#   contract intact without touching the frozen list.
#
#   ``backend/tests/unit/test_pytest_config_parity.py`` pins the result:
#   the set of markers the suite can use must be the same under this
#   config and under the repo-root one, and every bridged marker must
#   still be registered at runtime.
minversion = 7.0
pythonpath = .
             ..
             ../tools
# Global per-test timeout. The 40286 incident (Sept 2026) showed
# that a hung pytest can grow its stderr capture file to 30+ GB
# and pin SQLite WAL writers indefinitely — a hard cap turns
# "silent hang for hours" into "loud failure in 5 min" so the
# watchdog / supervisor can reap the orphan pytest instead of
# leaving it to rot on the next restart.
# ``thread`` method works on macOS (the ``signal`` method needs
# SIGALRM which Python disables under threading); pytest-timeout
# falls back automatically on platforms where signal is unsupported.
# pytest-timeout is already in the backend .venv (pip install
# pytest-timeout==2.4.0); this entry just enables the plugin.
timeout = 300
timeout_method = thread
markers =
    unit: Pure unit tests with no subprocess / network / filesystem side-effects. Default layer for the PR gate.
    integration: Slow / spawns local subprocesses / drives the real server, but needs NO model. Runs in CI (nightly + the integration lane).
    real_model: Really calls a model (claude CLI via ClaudeCodingTool) — needs ANTHROPIC_* + a live provider, so CI skips it (see tests/conftest.py). Only the local nightly runs these. The name is deliberately unlike any test/class name: pytest's -m also matches name keywords, so a marker named "llm" would silently drag in every test whose name mentions LLM.
    e2e: End-to-end tests that exercise the full task-execution pipeline. Main-branch only per test-design decision point 7.
    time_sensitive: Tests that assert on WALL-CLOCK time — a parallelism contract ("4 VPs in flight finish in 10s, not 40s"), a lock-serialisation contract, a sleep-based soak. They must run alone on the runner: sharing CPU with a parallel lane makes the very bound they assert unmeasurable, so they fail for a reason that has nothing to do with the code under test. Named ``time_sensitive`` rather than ``slow`` because none of them are slow — the whole set is about 30 seconds. ``test_backend_startup_latency_within_10ms`` joined that class in 2026-10-25: it compares the wall-clock latency of two real server boots, and on a loaded host the spread between two boots of the SAME tree is several times the 200 ms tolerance the comparison asserts, so running it beside other workers measures the runner's load rather than the code. What they cost is exclusivity, not duration, and the CI lane is built around that: a serial job that depends on the sharded unit lane rather than running beside it.
    perf: Performance benchmarks (backend startup, verification throughput). Excluded from the default lanes by the CI marker expressions ("not e2e and not integration and not time_sensitive and not perf") and run by the same serial lane as time_sensitive ("time_sensitive or perf"), whose --timeout=1800 is the only budget these can meet on a shared runner — a startup-latency delta measured in single-digit milliseconds is not a quantity a 2-core hosted runner can assert on. The addopts below do NOT exclude them; an earlier version of this line claimed they did, and the benchmarks spent that time timing out in the unit shard.
    files_to_modify: Tests covering SubTask.files_to_modify validation semantics.
    vendor_b_exhausted: Provider-fallback scenarios for one provider when its quota is exhausted mid-task.
    fallback_vendor_c: Provider-fallback scenarios for a second provider when other providers are unavailable.
    bug_1: Cross-table isolation — execution writes must not touch verification rows (anchor: test_execution_write_never_touches_verification_row, test_verification_write_never_touches_execution_row).
    bug_2: Concurrent start CAS guard — second start_execution/start_verification must 409 (anchor: test_start_verification_409_when_already_running, test_start_execution_409_when_already_executing).
    bug_3: Crash-recovery commit boundary — kill between BEGIN IMMEDIATE and COMMIT must leave no trace, kill after COMMIT must persist (anchor: test_kill_before_commit_leaves_no_trace, test_kill_after_commit_persists_change).
    bug_4: Scheduler re-reads external DB change — no in-memory _pending_*/_cache allowed; external UPDATE visible on next decide_tick (anchor: test_kill_mid_scheduler_tick_no_ghost_start, test_scheduler_tick_reads_external_db_change).
    bug_5: Concurrent verdict append atomicity — append_verdict under contention must not lose updates (anchor: test_concurrent_append_verdict_no_lost_update).
    acceptance_1: 8001 full plan lifecycle E2E (placeholder; L5 task).
    acceptance_2: Two concurrent executions and one verification coexist (placeholder; L5 task).
    acceptance_3: Crash recovery covers mid_execution and mid_verification (anchor: test_kill_mid_execution_recovers_consistent_progress, test_kill_mid_verification_recovers_consistent_round).
    acceptance_4: No state JSON filenames anywhere in production code (anchor: test_no_json_state_filename_in_backend_source, test_e2e_lifecycle_produces_no_state_json).
    # ``acceptance_5`` is deliberately NOT registered: its only consumers
    # live in ``backend/tests/regression/``, which is excluded from this
    # repo because those tests import the private ``tools/`` subsystem.
    # A marker with no cases fails
    # ``meta_tests::test_every_acceptance_marker_has_at_least_one_case``,
    # so re-adding the marker means re-adding its tests too.
    acceptance_6: 8000 plan states unchanged before/after refactor (placeholder; L5 task).
    acceptance_vp017: VP-017 acceptance gate — 9 consumer modules reach the state machine through repositories directly, with no cross-consumer aggregation facade, and reflect external DB changes on the next read (anchors: test_no_cross_consumer_aggregation_facade_exists, test_all_consumers_reflect_external_db_change_immediately).
    api_error_matrix: VP-018 9x5 API error code matrix — every (consumer, condition) cell matches its expected HTTP status and body marker (anchors: test_api_error_matrix, test_concurrent_start_yields_one_2xx_rest_409, test_archived_plan_write_returns_410_and_db_zero_change).
    asyncio: Async tests using pytest-asyncio
addopts =
    -v
    --strict-markers
    --tb=short
    -p no:cacheprovider
    -m "not time_sensitive"
